name: Ingest catchments

on:
  schedule:
    # Weekly check. Boundaries typically change once per academic year, but
    # checks always run against source checksums/metadata, never a blind
    # re-import.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      local_authority:
        description: "Local authority DfE code override (blank = all enabled sources)"
        type: string
        default: ""
      academic_year:
        description: "Academic year override, e.g. 2025-2026 (blank = as configured per source)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (no writes)"
        type: boolean
        default: false
      geometry_validation_only:
        description: "Validate geometry only, do not write to the database"
        type: boolean
        default: false
      force:
        description: "Force import even if checksum is unchanged"
        type: boolean
        default: false

concurrency:
  group: ingest-catchments
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.CATCHMENT_INGESTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import catchments
        run: >
          ingestor import-catchments
          ${{ github.event.inputs.local_authority != '' && format('--local-authority {0}', github.event.inputs.local_authority) || '' }}
          ${{ github.event.inputs.academic_year != '' && format('--academic-year {0}', github.event.inputs.academic_year) || '' }}
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          ${{ github.event.inputs.geometry_validation_only == 'true' && '--geometry-validation-only' || '' }}
          ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          GIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Import admission arrangements
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.geometry_validation_only != 'true'
        run: ingestor import-admissions
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          GIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catchment-validation-report
          path: services/ingestor/reports/
          if-no-files-found: ignore
