name: Ingest Scotland

on:
  schedule:
    # Weekly, not daily like GIAS: this source is refreshed from periodic
    # Scottish Government statistics releases, not a live transactional
    # register (see adapters/scotland.py's module docstring).
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes)"
        type: boolean
        default: false
      row_limit:
        description: "Limit rows processed (0 = no limit)"
        type: number
        default: 0

concurrency:
  group: ingest-scotland
  cancel-in-progress: false

jobs:
  ingest:
    # Confirmed live (2026-08-02): maps.gov.scot blocks GitHub Actions
    # runners with a 403, the same Azure-datacenter-IP pattern GIAS hits
    # (see PROJECT_STATUS.md) - unlike Wales and Northern Ireland's
    # sources, which both work fine from GitHub Actions. Scotland gets its
    # own gate, separate from DEVOLVED_NATIONS_INGESTION_ENABLED, so
    # enabling Wales/Northern Ireland doesn't also turn on a scheduled run
    # that's known to fail every time.
    if: vars.SCOTLAND_INGESTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import Scotland school register
        run: >
          ingestor import-scotland
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          ${{ github.event.inputs.row_limit != '' && github.event.inputs.row_limit != '0' && format('--row-limit {0}', github.event.inputs.row_limit) || '' }}
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          LOG_LEVEL: "info"
          GIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Verify
        run: ingestor verify
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
