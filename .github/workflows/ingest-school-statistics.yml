name: Ingest school statistics

on:
  schedule:
    # Weekly check. Most publications listed in config/statistics-sources.yml
    # update annually or termly; the ingestor detects new releases via the
    # EES API rather than re-importing unchanged data.
    - cron: "30 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes)"
        type: boolean
        default: false
      force:
        description: "Force import even if release is unchanged"
        type: boolean
        default: false

concurrency:
  group: ingest-statistics
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGESTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import statistics
        run: >
          ingestor import-statistics
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          GIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Import performance measures
        if: github.event.inputs.dry_run != 'true'
        run: ingestor import-performance
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          GIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Refresh derived metrics
        if: github.event.inputs.dry_run != 'true'
        run: ingestor refresh-metrics
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
