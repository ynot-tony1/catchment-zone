name: Ingest GIAS

on:
  schedule:
    # Daily source check. GIAS itself only updates its extract periodically;
    # the ingestor skips the import when the checksum is unchanged.
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes)"
        type: boolean
        default: false
      row_limit:
        description: "Limit rows processed (0 = no limit)"
        type: number
        default: 0
      force:
        description: "Force import even if checksum is unchanged"
        type: boolean
        default: false

concurrency:
  group: ingest-gias
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGESTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Discover current GIAS extract
        run: ingestor discover-gias

      - name: Import GIAS establishments and trusts
        run: >
          ingestor import-gias
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          ${{ github.event.inputs.force == 'true' && '--force' || '' }}
          ${{ github.event.inputs.row_limit != '' && github.event.inputs.row_limit != '0' && format('--row-limit {0}', github.event.inputs.row_limit) || '' }}
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          LOG_LEVEL: "info"
          GIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Import trust relationships
        if: github.event.inputs.dry_run != 'true'
        run: ingestor import-trusts
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          GIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Verify
        run: ingestor verify
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
