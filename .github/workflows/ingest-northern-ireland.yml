name: Ingest Northern Ireland

on:
  schedule:
    # Monthly, not daily/weekly: this source's only extract has been dated
    # February 2016 since before this project started, and CKAN's own
    # "quarterly" claim has not held (see adapters/northern_ireland.py's
    # module docstring). Checking monthly in case a newer extract ever
    # appears costs little; there is nothing to re-check more often than
    # that.
    - cron: "30 4 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes)"
        type: boolean
        default: false
      row_limit:
        description: "Limit rows processed (0 = no limit)"
        type: number
        default: 0

concurrency:
  group: ingest-northern-ireland
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGESTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import Northern Ireland school register
        run: >
          ingestor import-northern-ireland
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          ${{ github.event.inputs.row_limit != '' && github.event.inputs.row_limit != '0' && format('--row-limit {0}', github.event.inputs.row_limit) || '' }}
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          LOG_LEVEL: "info"
          GIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Verify
        run: ingestor verify
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
