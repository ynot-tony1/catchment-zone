name: Ingest Wales

on:
  schedule:
    # Weekly, not daily like GIAS: see adapters/wales.py's module docstring.
    - cron: "30 4 * * 2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes)"
        type: boolean
        default: false
      row_limit:
        description: "Limit rows processed (0 = no limit)"
        type: number
        default: 0

concurrency:
  group: ingest-wales
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.DEVOLVED_NATIONS_INGESTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import Wales school register
        run: >
          ingestor import-wales
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          ${{ github.event.inputs.row_limit != '' && github.event.inputs.row_limit != '0' && format('--row-limit {0}', github.event.inputs.row_limit) || '' }}
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          LOG_LEVEL: "info"
          GIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Verify
        run: ingestor verify
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
