name: Diagnose production database

# Temporary workflow used while recovering from a partially-applied
# migration. The diagnose job is read-only. The reset job drops every
# table it created and is gated behind a typed confirmation, same pattern
# as migrate-production.yml, since it is destructive. Remove this file
# once the migration issue it was added to debug is resolved; it is not
# part of the normal operational workflow set.

on:
  workflow_dispatch:
    inputs:
      reset_confirm:
        description: 'Type "reset-production-schema" to drop every table this project created (safe only because none have any data yet)'
        type: string
        required: false
        default: ""

jobs:
  diagnose:
    runs-on: ubuntu-latest
    if: github.event.inputs.reset_confirm != 'reset-production-schema'
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Show tables
        run: psql "${DATABASE_URL}&sslrootcert=system" -c "SHOW TABLES;"
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      - name: Show migration tracking rows
        run: psql "${DATABASE_URL}&sslrootcert=system" -c "SELECT id, migration_name, started_at, finished_at, applied_steps_count, logs FROM _prisma_migrations;" || echo "_prisma_migrations does not exist or is empty"
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

  reset:
    runs-on: ubuntu-latest
    if: github.event.inputs.reset_confirm == 'reset-production-schema'
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Drop every table this project created
        run: |
          psql "${DATABASE_URL}&sslrootcert=system" -c "
            DROP TABLE IF EXISTS
              _prisma_migrations,
              school_metrics,
              school_relationships,
              school_catchment_areas,
              admission_arrangements,
              historical_offers,
              catchment_areas,
              catchment_sources,
              postcode_cache,
              ingestion_runs,
              schools,
              academy_trusts,
              local_authorities
            CASCADE;
          "
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      - name: Drop every enum type this project created
        # DROP TABLE does not cascade to the enum types a dropped column
        # used, only to objects that depended on the table itself, so
        # these are left behind after the step above and block a clean
        # re-apply of the CREATE TYPE statements. CockroachDB does not
        # implement DROP TYPE ... CASCADE at all; plain DROP TYPE is fine
        # here since the tables that referenced these types are already
        # gone by this point.
        run: |
          psql "${DATABASE_URL}&sslrootcert=system" -c "
            DROP TYPE IF EXISTS
              \"SchoolStatus\",
              \"RelationshipType\",
              \"CatchmentCoverageStatus\",
              \"CatchmentSourceStatus\",
              \"IngestionStatus\";
          "
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      - name: Confirm empty
        run: |
          psql "${DATABASE_URL}&sslrootcert=system" -c "SHOW TABLES;"
          psql "${DATABASE_URL}&sslrootcert=system" -c "SELECT typname FROM pg_type WHERE typname IN ('SchoolStatus','RelationshipType','CatchmentCoverageStatus','CatchmentSourceStatus','IngestionStatus');"
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
