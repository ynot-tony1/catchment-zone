  # above describes, not attempted further this pass. (2) The
  # boundary/marker separation now uses OpenCV connected-component
  # labelling on the exact boundary colour (pure blue ~RGB(0,0,250) for
  # primary, pure red for secondary) directly, picking the
  # largest-bounding-box/low-fill-ratio component as the boundary
  # outline and the largest compact/high-fill-ratio component as the
  # marker, then fills the boundary via morphological closing + a
  # flood-fill from outside (not filled-region tracing, since these
  # PDFs bake the boundary as a raster outline with no real vector fill
