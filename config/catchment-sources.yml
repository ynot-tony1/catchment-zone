  # Suffolk: the existing candidate note (removed by this session, was in
  # candidates: below) said "Suffolk's catchment information is published
  # per-school as PDF/list, not as a map" and stopped there without
  # opening the actual PDFs - a fresh re-scan of the candidates list this
  # session found suffolk.gov.uk publishes a genuine flat table (not a
  # map): "Villages and Parishes Catchment Area List" (25 pages, real
  # extractable text confirmed via pdfplumber, not a scan), listing every
  # Suffolk village/parish alongside its assigned primary and high school
  # by name - the same road/place-list shape as Hartlepool/Essex/Wakefield/
  # Coventry/Wirral/Luton/North East Lincolnshire/Thurrock, except here the
  # council supplies the definitive village-to-school assignment directly
  # rather than needing per-address point-sampling to infer it.
  #
  # Technique: rather than reconstructing boundaries via Voronoi
  # tessellation over sampled points (this project's usual approach for a
  # road/place list with no coordinates), each clean village/parish name
  # was matched by exact name to its REAL civil parish administrative
  # boundary polygon from ONS's Open Geography Portal ("Parishes and Non
  # Civil Parished Areas (May 2025) Boundaries EW BGC", a live public
  # ArcGIS FeatureServer, no auth) - the PDF's own explanatory note
  # confirms this is the right approach ("for villages and parishes, most
  # catchment boundaries follow the parish boundary line"). This is a real
  # digitised-equivalent source (an authoritative administrative boundary),
  # not a point-sample reconstruction, though still filed as _partial per
  # this project's convention below given the real coverage gaps described
  # next.
  #
  # Parsing: pdfplumber word-position extraction (3 fixed columns by x0
  # threshold: village name / primary school / high school), reconstructing
  # wrapped multi-line cells (a continuation line has an empty school-name
  # column, or a non-empty village-name column but empty school columns on
  # its own line) - 1,111 raw table rows recovered. Of these, only the 430
  # "clean" single-condition rows (no "except"/"only" qualifier, no
  # embedded postcode, no ambiguous same-line locality disambiguator like
  # "Denham, Bury St Edmunds" vs "Denham, Eye") were used - the other ~680
  # are genuine postcode-split/conditional sub-areas within a parish
  # (deliberately excluded rather than guessed at, since assigning a
  # fraction of a parish without knowing exactly where the split line falls
  # would be exactly the geometry invention this project does not do) or
  # references to a separate town-specific catchment document ("See Bury
  # St Edmunds Area Schools Catchment List" etc. - Suffolk publishes 7
  # more of these for its towns, not yet attempted this session).
  #
  # Name matching: village/school names normalised (abbreviation expansion
  # - CEVC/CEVA/C of E -> full "Church of England Voluntary
  # Controlled/Aided" phrasing, apostrophe-stripping) and matched against
  # this project's own open Suffolk schools (365 candidates) by token
  # containment, restricted to the right phase (primary vs
  # secondary/middle) and augmented with each DB school's own
  # locality/town field so a source string's disambiguating suffix (e.g.
  # "Sir Robert Hitcham CEVA, Debenham") can match even where the school's
  # official name doesn't literally contain that place-name - 150 distinct
  # primary and 32 distinct high school short-names all matched
  # unambiguously (containment >=0.99, no ties), except a handful of
  # genuine cross-references to the other town documents (correctly
  # excluded, not a matching failure).
  #
  # Parish resolution: of 384 distinct clean village/parish names, 316
  # matched exactly one real ONS civil parish polygon confirmed to lie
  # inside Suffolk's own real county boundary (also fetched from ONS, used
  # to disambiguate same-named parishes elsewhere in England, and to catch
  # simple punctuation variants like "Capel St Mary" vs the ONS "Capel St.
  # Mary"). The other 68 were correctly left unresolved: most are small
  # hamlets/greens/tyes that are not their own separate civil parish at all
  # (e.g. "Shingle Street", "Bower House Tye"), and 5 are genuinely
  # ambiguous because Suffolk has two distinct real civil parishes sharing
  # the same name (Brettenham, Langham, Middleton each appear twice) -
  # left out rather than guessed at either way.
  #
  # Dissolve + verify: per school, unioned every matched parish polygon,
  # reduced to the single largest connected piece (per this project's
  # standing rule for any assembled/reconstructed geometry, even though
  # each input piece here is a real administrative boundary), then required
  # the school's own real DB coordinate to fall inside with a comfortable
  # >=100m margin to the nearest boundary edge (this project's standard
  # bar for point-precision uncertainty in DB school coordinates) - not
  # merely technically contained. 130 primary and 20 high schools had at
  # least one matched parish; 32 primary and 13 high schools failed this
  # check and were dropped, almost all for the same structural reason: the
  # parish the school itself physically sits in is a town parish handled
  # by one of the other 7 town-specific documents, not the Villages and
  # Parishes list, so the assembled polygon (built only from the outlying
  # villages that DO feed into it) never covers the school's own ground -
  # confirmed on inspection (e.g. Dennington Church of England Primary:
  # its own home-parish row was itself a postcode-conditional "except
  # Owl's Green" entry, correctly excluded upstream, leaving only
  # neighbouring villages assigned to it). Not a mapping/scale bug -
  # spot-checked against Aldeburgh Primary School (a single, unqualified,
  # unambiguous village-equals-parish case) which passed cleanly, showing
  # the pipeline mechanics themselves are sound.
  #
  # A later session attempted all 7 of the town-specific "Catchment Area
  # List" documents flagged above (Bury St Edmunds, Ipswich/Purdis Farm/
  # Rushmere St Andrew, Beccles, Brandon, Felixstowe and Trimley, Hadleigh,
  # Haverhill), each a real pdfplumber-extractable street-to-school table
  # (same 3-column x0-threshold parsing as the Villages and Parishes list,
  # with continuation-line detection refined: a genuine new row always
  # carries a - possibly placeholder - high-school value, so a row with an
  # EMPTY high-school column is always a wrapped continuation of the
  # previous row, whichever of its own columns carry text; this caught a
  # real bug where a page-footer number landing in the high-school
  # column's x-range was briefly mis-merged into the preceding entry
  # before a "whole row is just digits" skip was added). "X/Y" dual-school
  # entries (e.g. "Castle Hill I/Castle Hill J", "Ranelagh/Sproughton
  # CofE") and house-number sub-range splits of one street (e.g. "Barons
  # Road ... 1-11 only" vs "...12-104 only") were excluded from the point
  # sample the same way the Villages and Parishes pass excluded
  # postcode-conditional sub-areas - never guessing which part of a street
  # goes where. Bare trailing "I"/"J" abbreviations (Castle Hill, Fairfield/
  # Colneis, Springfield) were expanded to Infant/Junior and matched to the
  # correct distinct school; "Henley Gate (school to open Sept 2027)" was
  # excluded as a genuinely future, not-yet-open school with no DB record.
  #
  # Two techniques were used depending on how a document actually assigned
  # its town, discovered per document rather than assumed: where a
  # document puts effectively the whole town under ONE school (Beccles's
  # high layer, Brandon's high layer, both of Hadleigh's layers), that
  # school's real ONS civil parish/town-council boundary was used directly
  # - no Voronoi needed, since there was nothing to split. Where a town
  # splits across several schools (Bury St Edmunds, Felixstowe and
  # Trimley, Haverhill, Ipswich), this project's road-list Voronoi
  # pipeline was used instead: every distinct street geocoded via
  # Nominatim (one point per street, evenly subsampled per school up to a
  # cap for the larger towns to keep within a session's realistic request
  # budget), Voronoi-tessellated, clipped to the town's own ONS civil
  # parish (or, for unparished Ipswich, the Ipswich LAD boundary unioned
  # with the real neighbouring parishes its own streets actually sit in -
  # Rushmere St Andrew, Sproughton, Claydon), reduced to the single largest
  # connected piece per school, and required a >=100m own-coordinate
  # margin exactly as above. 44 schools passed this bar (34 primary + 10
  # secondary, 2 of which - Claydon Primary and Claydon High - were
  # already covered by the Villages and Parishes layer above and correctly
  # deduplicated rather than double-listed, for 33 + 9 = 42 genuinely new
  # polygons). A real, expected fragmentation case was caught and declined
  # rather than forced: New Cangle Community Primary's own coordinate fell
  # inside a real but non-dominant Voronoi fragment once the town's other
  # schools' points were added, exactly the failure mode this project's
  # "keep only the largest connected piece" rule exists to catch.
