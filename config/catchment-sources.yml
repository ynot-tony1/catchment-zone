    last_verified_at: "2026-08-07"
    parser_name: "generic_geojson"
    enabled: true
    notes: >
      41 primary/infant catchment polygons covering 37 distinct zones (some
      zones are shared by co-located Infant and Junior schools, e.g.
      Meon/King's Academy College Park/King's Academy Northern Parade) -
