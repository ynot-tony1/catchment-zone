  # Bournemouth, Christchurch and Poole (BCP): no GIS/API of any kind exists
  # (re-confirmed - ArcGIS org, both open-data hub hostnames, all zero
  # datasets). The council instead publishes one QGIS-exported A4 PDF map
  # per school (boundary + a red school-location marker + a printed scale
  # bar), e.g. bcpcouncil.gov.uk/Assets/Schools-and-learning/Catchment-
  # area-maps/Poole-High-School-catchment-area-and-map.pdf. Per this
  # project's standing authorisation to digitise published PDF/image maps
  # for this private, non-commercial project (not just search for ready-
  # made GIS endpoints), these 36 polygons (29 primary, 7 secondary, out
  # of 45 published PDFs) were traced from those PDFs programmatically:
  # each PDF's black boundary curve was isolated by pixel colour/shape
  # (excluding the page frame and any legend box), closed across small
  # rendering gaps where another map layer draws over the line (e.g. a
  # river), then georeferenced using two facts read directly from the
  # same PDF - the printed scale bar (gives real metres per pixel) and
  # the red school-location marker's pixel position, anchored to that
  # school's own real coordinates already in this project's `schools`
  # table (GIAS-sourced) - plus a north-up assumption (verified true from
  # each PDF's own north arrow). This is real digitisation of the
  # council's own published boundary, not an invented or estimated shape;
  # every polygon was checked to actually contain its own school's real
  # coordinate before being written out.
  #
  # A later pass added 3 more (Baden-Powell-and-St-Peters, Livingstone-
  # Infant, Manorside) that a prior session had mis-categorised as an
  # "older raster-screenshot template with no usable vector boundary or
  # scale bar" - on inspection these actually have a clean vector
  # boundary line, a red school-location marker, and a precise numeric
  # ratio scale ("Scale 1:31000" etc, greyscale OS-2013-vintage template,
  # visually distinct from but functionally equivalent to the coloured/
  # scale-bar template). The ratio scale converts to real metres-per-
  # pixel exactly, given a controlled render DPI (200) and the PDF's own
  # page size in points (standard 72pt/inch): metres_per_pixel = ratio *
  # 0.0254 / DPI - no bar-tick pixel detection needed, arguably more
  # precise than the bar-based method. The boundary itself was isolated
  # as the single largest black connected component after excluding the
  # one component whose bounding box covers almost the entire page (the
  # printed page-frame rectangle) - text labels and street lines are far
  # smaller. Verified pixel-perfect via a full contour + marker overlay
  # redrawn onto each source render; each polygon contains its own
  # school's real coordinate.
  #
  # A further pass solved 3 of the 5 "no red marker" schools (Lilliput,
  # St Michael's, Queen's Park Infant) by anchoring to a different real,
  # precisely-locatable point instead of a school marker: a nearby named
  # landmark visible on the same map (a railway station icon for Lilliput
  # and St Michael's; the visual pixel-centroid of a hospital's building
  # cluster for Queen's Park Infant), geocoded via OpenStreetMap Nominatim
  # for its real coordinate, combined with the map's own printed scale bar
  # for metres-per-pixel. Same north-up assumption and boundary-extraction
  # method as the marker-based schools. Each result was independently
  # verified by checking the served school's own real database coordinate
  # falls inside the resulting polygon (it does, for all 3) and by a full
  # contour-overlay redraw onto the source render (pixel-perfect for
  # Lilliput/St Michael's; Queen's Park Infant's anchor - a building-
  # cluster centroid rather than a single point - carries a little more
  # slop, visually ~1-2 pixels/a few metres at this map's scale, still
  # well inside this method's normal tolerance).
  #
  # The last 3 of the 45 published PDFs (Mudeford Community Infants,
  # Old Town Infant and Nursery, Bishop Aldhelm's) had no red school
  # marker and no pdftotext-extractable landmark text (place-name/street
  # labels are raster basemap content on these PDFs, not selectable
  # text) - solved in a later pass by anchoring to a real, precisely
  # locatable ROAD FEATURE instead of a point-of-interest icon: Mudeford
  # via the large A35 Christchurch Bypass / Stony Lane roundabout
  # ("Iford roundabout", pixel-centroided from the map's own green
  # roundabout-island fill, then geocoded as the centroid-average of its
  # several roundabout-tagged Overpass way segments); Old Town via Poole
  # railway station's own National Rail icon (geocoded via Overpass);
  # both combined with the map's own printed scale bar (719px = 1000m
  # for Mudeford, 690px = 1000m for Old Town, both re-measured at this
  # project's usual 300dpi render). Bishop Aldhelm's uses a different,
  # newer dual-zone template ("Parish Catchment" as a solid blue
  # outline+hatching, "Local Authority Catchment" as a semi-transparent
  # pink fill, both over an OS basemap) with an exact printed ratio
  # scale ("Scale: 1:20000 True@A4P") instead of a bar and still no
  # marker - solved by anchoring to St Michael's Roundabout on the
  # B3066 (pixel-centroided from its visible ring, geocoded via
  # Overpass), with scale computed exactly from the ratio plus the
  # PDF's own known page size (595x842pt, i.e. A4) and render DPI rather
  # than a pixel-measured bar (more precise: no bar-endpoint measurement
  # error at all). Parish traced the same way as every line-boundary
  # source in this file (largest black - here, pure-blue (0,0,255) -
  # connected component, dilated/eroded closed, contour simplified).
  # The LA zone has no clean outline of its own to trace directly (the
  # Allerton-High-style alpha-blended-fill technique breaks down here:
  # this fill sits over a dense urban area including saturated orange
