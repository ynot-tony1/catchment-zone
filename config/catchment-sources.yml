    download_url: "https://raw.githubusercontent.com/ynot-tony1/catchment-zone/main/data/digitized-catchments/bcp/bcp_digitized_primary_catchments.geojson"
    name_field: "CATCHMENT_NAME"
    format: "geojson"
    coordinate_reference_system: "EPSG:4326"
