  # documentation endpoint directly, which serves a human-readable
  # snapshot page by default - sending "Accept: application/json"
  # makes the exact same URL return real GeoJSON instead, which is
  # what actually made bulk querying practical at all. (2) The
  # remaining name-mismatch failures turned out to be mostly a real,
  # structural fact rather than a data-quality problem: cross-
  # referencing every match/non-match against this project's own
  # religious_character field showed non-faith ("Does not apply")
  # schools matched 29/43 (67%) even before further name-variant work,
  # while Church of England schools matched only 1/36 (3%) and Roman
  # Catholic 0/4 - Herefordshire's council-administered "priority
  # admission area" simply does not cover most voluntary
  # aided/controlled faith schools, which set their own admissions
  # criteria instead (a real, known feature of English admissions, not
  # a gap in this API). For the remaining non-faith mismatches, the API
  # expects each school's OLDER pre-academy-conversion name in most
