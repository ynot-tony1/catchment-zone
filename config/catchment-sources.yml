  # public search endpoint, ~1 req/sec, structured as "<road>, <town>, United
  # Kingdom" (or county-qualified for the 16 town-less glued rows) with a
  # North East Lincolnshire-sized viewbox and bounded=1; 1,710 resolved
  # (63%).
  #
  # Reconstruction: identical Voronoi-tessellation-plus-trust-radius-clip
  # method as Hartlepool/Essex/Wakefield/Coventry/Wirral/Luton - tessellated
  # separately by phase, dissolved by school, clipped to the real North East
