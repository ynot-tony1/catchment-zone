# Catchment and priority-admission-area source registry.
#
# This is not a claim of national coverage. catchment-zone begins with a
# small pilot of local authorities that publish official, machine-readable
# boundary data under a reuse-compatible licence. See docs/data-sources.md
# and docs/admissions-and-catchments.md for the coverage policy.
#
# Every entry here was verified against the publisher's live ArcGIS item
# metadata (licenseInfo + Feature Service url) before being added. The
# ingestor re-verifies checksum and licence on every scheduled run and will
# refuse to import a source whose licence field is missing or incompatible.
#
# format: one of geojson | shapefile_zip | geopackage | kml | csv_wkt |
#         arcgis_feature_service | json_endpoint | wfs_geojson
#
# wfs_geojson entries (a generic OGC WFS 2.0 GetFeature source, not an
# ArcGIS FeatureServer - e.g. Angus's XMap Cloud WFS) must also set
# wfs_type_name to the WFS typeName parameter (e.g.
# "angus_public:primary_school_catchment").

sources:
  - local_authority_code: "373"
    local_authority_name: "Sheffield"
    academic_year: "2025-2026"
    source_type: "primary_catchment"
    source_url: "https://sheffield-city-council-open-data-sheffieldcc.hub.arcgis.com/datasets/1cfbc328f918482bb25f4d092eb45d8b_1/about"
    download_url: "https://sheffieldcitycouncil.cloud.esriuk.com/server/rest/services/AGOL/OpenData/FeatureServer/1"
    format: "arcgis_feature_service"
    coordinate_reference_system: "EPSG:27700"
    licence: "Open Government Licence v3.0 (contains OS data, Crown copyright and database right)"
    last_verified_at: "2026-08-01"
    parser_name: "sheffield_arcgis_feature_service"
    enabled: true
    notes: >
      Sheffield's own metadata states catchment areas are legally defined by
      postcode and street number, not by the mapped polygon; the boundary is
      described by the publisher as illustrative only. The ingestor and UI
      must preserve this caveat verbatim, not soften it.

