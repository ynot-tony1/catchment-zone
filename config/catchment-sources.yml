  # primary_catchment/secondary_catchment, which would require guessing
  # phase from school name.
  #
  # Confirmed structural, not an under-searched source: a coverage-gap
  # audit (2026-08-11) flagged Lancashire's ~144-school gap (41 GPA
  # polygons vs ~700 open schools) as looking unexplained, but Lancashire
  # County Council's own live admissions pages confirm a GPA is a real
  # but genuinely partial concept, not borough-wide - its determined
  # admission arrangements describe "community and voluntary controlled
  # schools which are subject to a GPA" (i.e. only some are), and its own
  # public "Geographical priority area (GPA) mapping" index page
  # (lancashire.gov.uk/children-education-families/schools/apply-for-a-
  # school-place/geographical-priority-area-mapping/) lists GPA maps only
  # for the same handful of oversubscribed schools already captured by
  # this ArcGIS layer. Every other Lancashire school (the large majority)
  # is either an own-admission-authority academy/VA/foundation school
  # using its own policy, or a community/VC school with no GPA at all,
  # falling back to straight-line distance as the deciding criterion -
  # the same structural pattern already confirmed for Halton and Bristol.
  # Not pursued further.
