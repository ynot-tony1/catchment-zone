  # "_name$" field (not a "Name" field at the top level, unlike Derby's
  # response shape) found overlay 78 = "Primary School Catchment Areas".
  # Its Features.json paginates through opaque base64-style feature refs
  # (not Derby's sequential I{n} refs); appending .geojson to each ref
  # under Overlays/78/Features/{ref}.geojson returns real polygon geometry
  # in EPSG:27700 plus a "School Name"/"School Number" properties pair (no
  # DfE URN directly, unlike Derby - matched to this project's schools by
  # name instead, see below). Reprojected to WGS84 with pyproj/shapely.
  # No secondary/high-school layer exists in the same 79-overlay list,
  # consistent with the prior note that Stoke's council states high-school
  # admissions aren't catchment-based - primary-only is expected, not a
  # partial result.
