  # Bristol: runs "priority area" admissions (first/second priority) rather
  # than a single catchment boundary - both kept "secondary"-prefixed since
  # each still represents a real geographic admissions boundary for a named
  # secondary school.
  #
  # UPDATE (2026-08-11): the remaining gap (Bristol has 174 open schools;
  # only these 2 layers' ~130-school combined coverage is deployed) was
  # investigated for a from-scratch primary source and for the 4 secondary
  # schools missing from the "first priority" layer (Blaise High School,
  # Oasis Academy Brislington, Oasis Academy Brightstowe, St Bede's
  # Catholic College) - confirmed a structural dead end, not an
  # under-searched gap:
  #   - Primary: Bristol's determined "Admission arrangements for
  #     community and voluntary controlled infant and primary schools"
  #     document states the only geographic oversubscription criterion is
  #     "3. Geography - Children living closest to the school as measured
  #     in a direct line" - no priority-area/catchment concept at all for
  #     LA-run primaries. Both of Bristol's ArcGIS services were fully
  #     re-enumerated: maps2.bristol.gov.uk/.../ll_education/MapServer
  #     (layer 6, "Infant, Junior and Primary schools") and the much
  #     larger maps2.bristol.gov.uk/.../moving_home/FeatureServer (75
  #     layers total, including layer 19 "Primary schools") - both are
  #     esriGeometryMultipoint (school locations only), and neither
  #     service has any primary-catchment polygon layer among its other
  #     layers. A misleadingly-titled "Bristol Primary Education" ArcGIS
  #     Experience app (experience.arcgis.com/experience/
  #     9aa54c22c5ce4d198083e376195ab498) was checked via its item JSON
  #     and confirmed to be a mistitled clone of the secondary schools
  #     app, wired to the exact same "Bristol Secondary Schools" web map
  #     and its point-only Secondary schools layer - not a real primary
  #     source.
  #   - Secondary: the 4 missing schools were confirmed absent from the
  #     live "first priority" FeatureServer query itself (25 named areas,
  #     none matching any of the 4), and each school's own published
  #     admissions policy confirms why: Blaise High, Oasis Brislington and
  #     Oasis Brightstowe are academies whose own oversubscription policy
  #     is plain straight-line distance with no priority area at all.
  #
  #   UPDATE (2026-08-12): St Bede's Catholic College's "Catchment Area
  #   Map" was investigated properly this session, not just noted as a
  #   dead end. Its own admission policy PDF (bristol.gov.uk/files/
  #   documents/4080-st-bedes-admissions/file), read in full, confirms
  #   this genuinely is a geographic admissions criterion, not just a
  #   faith-reference lookup: oversubscription criterion 2 is "Catholic
  #   children who are resident in the school's designated parish(es)",
  #   ranked above "Other Catholic children" (criterion 3) - parish
  #   residency is a real tie-break within the Catholic applicant pool,
  #   for 20 named Clifton Diocese parishes (note 12 of the policy). The
  #   school's own "Parish maps to show geographical area of prime
  #   responsibility" page (stbedescc.org, reached via a working page ID
  #   the site's own bit.ly link redirects through, pid=88 not the dead
  #   pid=35) links one PDF per parish, and each PDF was confirmed - not
  #   assumed - to contain a real drawn boundary: an OS-referenced raster
  #   basemap ("Contains OS Data (c) Crown Copyright...") with a bold
  #   closed black polygon traced on top, the same "real drawn boundary"
  #   pattern as this project's other raster-PDF sources (Christchurch,
  #   Stoke Row), not a text-only parish description. No Diocese of
  #   Clifton GIS/open-data boundary set exists publicly (checked) - the
  #   school's own PDFs are the only real source, same as first assumed.
  #
  #   Digitised via real estate railway station markers (magenta dots
  #   printed on the basemap, e.g. Sea Mills, Redland, Clifton Down)
  #   matched to their genuine published coordinates as ground-control
  #   points for a per-PDF affine/similarity georeferencing fit (3-4
  #   points where visible, one map's residuals cross-checked to 12.6m,
  #   most under 1m on an exact 3-point fit) - not traced/guessed, a real
  #   coordinate transform same in spirit to this project's other
  #   pixel-measured tracings. St Bede's own real DB coordinate falls
  #   inside its home parish (Our Lady of the Rosary, Lawrence Weston)
  #   with a 658m margin, cross-validating the technique.
  #
  #   UPDATE (2026-08-12, later session): the remaining 6 "stuck" parishes
  #   from the first pass (Thornbury, Nailsea, Portishead, Henbury,
  #   Downend, Patchway) plus the 4 never-attempted ones (Clevedon,
  #   Shirehampton, Filton, Southmead) were revisited. The school's own
  #   "Parish maps" page (pid=88) was re-crawled directly from its raw
  #   HTML (not the earlier WebFetch markdown conversion, which had
  #   silently truncated one PDF's hex filename) to get the authoritative
  #   full list of all 20 parish PDF links, cross-referenced against what
  #   was already digitised.
  #
  #   The "open boundary line" diagnosis from the first pass turned out to
  #   be wrong in every case checked: skeletonising each drawn boundary
  #   and walking it as a graph (networkx shortest path between the two
  #   true endpoints, distinguished from false-positive skeleton artefacts
  #   at sharp vertices by visual inspection of each candidate) showed the
  #   line is fully drawn and closes cleanly except where it reaches the
  #   Severn Estuary/Avon coastline - a genuine, deliberate cartographic
  #   convention (the coast itself is the boundary there, so it is not
  #   separately hand-drawn) rather than a rendering artefact. Thornbury,
  #   Henbury, Portishead and Nailsea/Clevedon all close this way: the
  #   drawn portion was traced pixel-exactly via the skeleton graph, and
  #   the coastal portion was digitised from the same basemap's own
  #   depicted coastline (the boundary between land and the tidal-flat/
  #   water symbol), not invented.
  #
  #   A second finding fixed the "too few nearby rail stations" cases:
  #   these basemaps carry a real 1km OS grid (confirmed at exactly
  #   315px/1000m at 200 DPI, i.e. 1:25000 scale, independently verified
  #   against two known station-to-station distances to within 0.1-0.5%
  #   error) - so a single identifiable real point (a station dot, precise
  #   to a few metres) is enough to fully anchor a map once the shared
  #   scale/no-rotation model is trusted, without needing a second
  #   in-frame point. Patchway's own basemap is a different (older,
  #   scanned, red-highlighter) template without this grid; it was
  #   anchored with a real 2-point similarity fit (Pilning and Severn
  #   Beach stations, both visible on its own map) with rotation forced to
  #   0 (real OS-derived maps are north-up; the raw 2-point fit implied an
  #   implausible 5.9 degree rotation, diagnosed as pixel-picking noise
  #   from the low-contrast scan rather than a real map rotation) and
  #   scale cross-checked against the map's known real-world extent.
  #
  #   Downend (Holy Family Catholic Parish is not one of its parishes -
  #   St Augustine of Canterbury, Downend is) remains undigitised: its
  #   linked file is not a PDF at all but an 813x468px newsletter PNG,
  #   confirmed via a direct re-fetch to be the only resolution the school
  #   publishes. That native resolution is too coarse to identify any
  #   landmark's pixel location with confidence (verified against two
  #   candidate town-centre labels, both illegible even at 6x upscaling) -
  #   a genuine source limitation, left undigitised rather than guessed.
  #
  #   19 of the 20 designated parishes are now digitised. Recorded under
  #   "secondary_catchment_partial" still, since Downend remains
  #   outstanding. Two genuine oddities preserved rather than "cleaned
  #   up": the three Weston-super-Mare parishes (Corpus Christi, Our Lady
  #   of Lourdes, St Joseph's) publish pixel-identical boundary maps, and
  #   Nailsea and Clevedon's differently-styled basemaps publish the exact
  #   same underlying boundary geometry (confirmed via matching endpoint
  #   coordinates and grid scale) - real quirks in the source, not
  #   digitisation errors - so the importer's existing same-checksum merge
  #   logic (see _merge_areas_sharing_geometry in adapters/catchments.py)
  #   collapses each pair into one combined-name row at import time.
  #   A handful of "Not applicable"-phase schools (special schools, PRUs,
  #   AP units) also show up as uncovered in a point-in-polygon audit but
  #   were not investigated - those admission types aren't geographic by
  #   nature.
