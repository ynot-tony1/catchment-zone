  # Academy/Junior/Infant/Nursery/etc, "Church of England"/"C of E"
  # consolidated first so "England Lane Academy" doesn't lose its own place
  # name) and comparing what's left, filtered by phase (primary names only
  # matched against open primary schools, secondary against secondary) to
  # avoid same-place-name cross-phase collisions (e.g. "De Lacy Primary
