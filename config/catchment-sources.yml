# ---------------------------------------------------------------------------
# Candidate sources identified but not yet enabled (require manual licence
# and format verification before flipping enabled: true). Left here so the
# next pilot expansion has a documented starting point rather than a fresh
# search. Do not enable without repeating the verification steps above.
# ---------------------------------------------------------------------------
candidates:
  - local_authority_name: "Stockport"
    reason_not_enabled: "Both ArcGIS Hub portal hostnames (stockport-council-opendata.hub.arcgis.com, stockport.opendata.arcgis.com) are live but return zero datasets via DCAT feed. The council's own catchment tool (stockport.gov.uk/find-your-catchment-area) is a server-side address-lookup form, not a map - no GIS markers in its HTML, no AGOL org search hits."
  - local_authority_name: "Kingston upon Hull"
    reason_not_enabled: >
      Confirmed running Astun iShare (maps.hull.gov.uk;
      atMapSettingsJS.aspx returns real wmsUrl/dataUrl config), the same
      platform successfully used for North Lincolnshire above, but Hull's
      own GetOWS.ashx returns a hard, unconditional HTTP 500 (generic IIS
      error page) regardless of ~12 parameter combinations tried
      (SERVICE/REQUEST/MAPSOURCE variants, with and without a session
      cookie) - a materially different failure mode from North
      Lincolnshire's identical platform (which worked once the correct
      MAPSOURCE prefix was found), so this looks like a broken/
      misconfigured deployment on Hull's side, not a guessable parameter
      issue. GetData.aspx?service=MapSource&RequestType=JSON also always
      500s. The council's actual public catchment publication is
      PDF-only (hull.gov.uk/downloads/file/4889 and /4891).
  - local_authority_name: "North East Lincolnshire"
    reason_not_enabled: "Only official catchment artifact is a plain PDF list (not even a map): nelincs.gov.uk/assets/uploads/2024/08/School-catchment-list-2024-2025.pdf. Four candidate ArcGIS Hub hostnames all resolve but return zero datasets via DCAT feed. No evidence this council runs the same iShare platform as neighbouring North Lincolnshire."
  - local_authority_name: "Southampton"
    reason_not_enabled: "Council states explicitly that its catchment map is 'a digital map, not a paper map, and so is not available for inspection by the public,' and separately that no Southampton secondary school has a catchment area at all. southampton-opendata.hub.arcgis.com returns zero datasets via DCAT feed. www.southampton.gov.uk is behind an Incapsula bot-mitigation challenge from this environment, blocking direct page inspection."
  - local_authority_name: "Leicester"
    reason_not_enabled: "schoolinfo.leicester.gov.uk is a form-based address-to-school finder with no map/GIS markers. Leicester's real open-data portal (data.leicester.gov.uk, Opendatasoft, 393 datasets) was checked exhaustively - no catchment or school-boundary dataset exists. leicester-opendata.hub.arcgis.com DCAT feed also empty."
  - local_authority_name: "Derby"
    reason_not_enabled: >
      Runs Cadcorp GeognoSIS WebMap (maps.derby.gov.uk/webmap/), the same
      platform already documented as a dead end for Bridgend and
      Stoke-on-Trent above - real named catchment data confirmed to
      exist server-side (the map's info-click template config references
      'secondary school catchment'/'primary school catchment' layers by
      name), but only reachable through a session-scoped GeognoSISRest
      layer behind proxy.axd with no public WFS endpoint discoverable
      from static HTML/JS inspection (wfs.exe 404s). Worth a follow-up
      pass with a real browser session (as was done for Bridgend) rather
      than curl alone.
  - local_authority_name: "Stoke-on-Trent"
    reason_not_enabled: "Same Cadcorp GeognoSIS platform as Derby above (webmaplayers.stoke.gov.uk/webmaplayers8/), same session-scoped proxy.axd architecture with no public WFS/REST endpoint found. The council's own help text confirms a 'Primary School Catchment Areas and Schools' layer exists. High-school catchments don't exist at all per the council (non-catchment admissions)."
  - local_authority_name: "Bournemouth, Christchurch and Poole"
    reason_not_enabled: "BCP's own ArcGIS Online org (bcpcouncil.maps.arcgis.com) was searched org-scoped: zero catchment items, only two point layers of school locations. Both open-data hub hostnames return zero datasets via DCAT. The council instead publishes one PDF per school (e.g. .../Poole-High-School-catchment-area-and-map.pdf)."
  - local_authority_name: "Isles of Scilly"
    reason_not_enabled: "Structural, not a search failure: the islands have exactly one all-through school (Five Islands Academy) serving all five inhabited islands - with no second school to be zoned against, 'catchment area' as this project defines it does not meaningfully apply. No GIS/open-data presence found for the council at all."
  - local_authority_name: "Cumberland"
    reason_not_enabled: "Council's own catchment-areas page explains catchment is based on GIS-measured walking distance but contains no map link at all, directing residents to contact schools directly. Three candidate ArcGIS Hub hostnames (plus the former Cumbria county's) are all live but all return zero datasets via DCAT."
  - local_authority_name: "Westmorland and Furness"
    reason_not_enabled: "Same situation as Cumberland: text-only catchment-areas page with no map link. Both candidate open-data hub hostnames live but zero datasets via DCAT."
  - local_authority_name: "Blackburn with Darwen"
    reason_not_enabled: "No official ArcGIS org found (the one AGOL hit belongs to an unrelated personal/hobbyist account, not the council). No maps.blackburn.gov.uk host resolves. No CKAN catchment dataset. Council only publishes an unrelated planning-applications map."
  - local_authority_name: "Blackpool"
    reason_not_enabled: "Has a genuine ArcGIS Online org (blackpool.maps.arcgis.com), searched org-scoped: zero catchment items, only an 'Education Establishments' point layer (school locations, not boundaries)."
  - local_authority_name: "Stockton-on-Tees"
    reason_not_enabled: "www.stockton.gov.uk (including the specific school-admissions-zones page) is behind a Cloudflare 'Just a moment...' JS challenge on every page tested from this environment, the same category of block already documented for Brighton/Islington's WhatDoTheyKnow pages - an access barrier, not a confirmed data-absence finding. No independent AGOL org or CKAN dataset found either. Worth retrying from a different network origin."
  - local_authority_name: "Darlington"
    reason_not_enabled: "No AGOL org, no CKAN hit, no resolvable GIS subdomain found. Only third-party sources (School Guide, Locrating, catchment.school) surfaced."
  - local_authority_name: "Hartlepool"
