    notes: "7 of 13 primary 'Area of Prime Responsibility' zones digitised (33 schools total): Map 8 Frenchay CE Primary School (single school); Map 11 Bradley Stoke Community School (single school, primary phase of an all-through academy); Map 12 Filton Primaries Consortium (Charborough Road/Shield Road/Filton Hill, 3 schools); Map 15 Kingswood North/Downend/Emersons Green Consortium (14 schools, 1 more - St Augustine of Canterbury Catholic Primary - explicitly excluded per the source document despite sitting geographically inside the polygon, a faith-school admissions exclusion); Map 16 Kingswood South & Hanham Primaries Consortium (Samuel White's Infant, Hanham Abbots Junior, Christ Church Hanham CE Primary, Beacon Rise Primary, Courtney Primary, The Park Primary - 6 schools, 1 more - Our Lady of Lourdes Catholic Primary - explicitly excluded, same faith-school pattern); Map 18 Cadbury Heath/Longwell Green Consortium (Barrs Court, Cadbury Heath, Longwell Green, Parkwall - 4 schools); Map 19 Warmley/Bitton Consortium (Cherry Garden, Redfield Edge, St Anne's CE, St Barnabas CE - 4 schools, 1 more - The Meadows Primary - explicitly excluded and, unlike the other two exclusions, geometrically confirmed OUTSIDE the fitted polygon too, consistent with it being a plain proximity/geographic exclusion rather than a faith-school admissions one). Margins for all 33 included schools ranged 351-963m against fit residuals of 7-73m (Maps 16/18/19, full affine fit) or exact 0-residual fits with 592-908m margins (Maps 8/11/12/15, from the prior session's similarity fit). Map 17 (King's Oak Academy Primary Phase) remains genuinely undigitised: it is the only primary APR page with just one real school GCP and no second school plotted on its own base-map crop; a cross-page tie-point fit was built and tested (transferring 6 shared place-name label positions from Map 16's well-anchored fit) but left a ~700-900m systematic disagreement at the one real anchor against only a 165m contain