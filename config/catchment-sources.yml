# Catchment and priority-admission-area source registry.
#
# This is not a claim of national coverage. catchment-zone begins with a
# small pilot of local authorities that publish official, machine-readable
# boundary data under a reuse-compatible licence. See docs/data-sources.md
# and docs/admissions-and-catchments.md for the coverage policy.
#
# Every entry here was verified against the publisher's live ArcGIS item
# metadata (licenseInfo + Feature Service url) before being added. The
# ingestor re-verifies checksum and licence on every scheduled run and will
# refuse to import a source whose licence field is missing or incompatible.
#
# format: one of geojson | shapefile_zip | geopackage | kml | csv_wkt |
#         arcgis_feature_service | json_endpoint

sources:
  - local_authority_code: "373"
    local_authority_name: "Sheffield"
    academic_year: "2025-2026"
    source_type: "primary_catchment"
    source_url: "https://sheffield-city-council-open-data-sheffieldcc.hub.arcgis.com/datasets/1cfbc328f918482bb25f4d092eb45d8b_1/about"
    download_url: "https://sheffieldcitycouncil.cloud.esriuk.com/server/rest/services/AGOL/OpenData/FeatureServer/1"
    format: "arcgis_feature_service"
    coordinate_reference_system: "EPSG:27700"
    licence: "Open Government Licence v3.0 (contains OS data, Crown copyright and database right)"
    last_verified_at: "2026-08-01"
    parser_name: "sheffield_arcgis_feature_service"
    enabled: true
    notes: >
      Sheffield's own metadata states catchment areas are legally defined by
      postcode and street number, not by the mapped polygon; the boundary is
      described by the publisher as illustrative only. The ingestor and UI
      must preserve this caveat verbatim, not soften it.

  - local_authority_code: "373"
    local_authority_name: "Sheffield"
    academic_year: "2025-2026"
    source_type: "secondary_catchment"
    source_url: "https://sheffield-city-council-open-data-sheffieldcc.hub.arcgis.com/datasets/a3883491804f4886a33c1b66b59fbe47_3/about"
    download_url: "https://sheffieldcitycouncil.cloud.esriuk.com/server/rest/services/AGOL/OpenData/FeatureServer/3"
    format: "arcgis_feature_service"
    coordinate_reference_system: "EPSG:27700"
    licence: "Open Government Licence v3.0 (contains OS data, Crown copyright and database right)"
    last_verified_at: "2026-08-01"
    parser_name: "sheffield_arcgis_feature_service"
    enabled: true
    notes: >
      Access and Admissions Team, Sheffield City Council is the named
      accessInformation contact on the source item.

  - local_authority_code: "S12000033"
    local_authority_name: "Aberdeen City"
    academic_year: "2025-2026"
    source_type: "primary_catchment"
    source_url: "https://spatialdata-accabdn.opendata.arcgis.com/datasets/accabdn::primary-school-catchments"
    download_url: "https://services5.arcgis.com/0sktPVp3t1LvXc9z/arcgis/rest/services/Primary_School_Catchments/FeatureServer/58"
    format: "arcgis_feature_service"
    coordinate_reference_system: "EPSG:27700"
    licence: "Open Government Licence v3.0 (contains OS data, Crown copyright and database right)"
    last_verified_at: "2026-08-02"
    parser_name: "sheffield_arcgis_feature_service"
    enabled: true
    notes: >
      49 primary catchment polygons, each carrying the school's own SEED_CODE
      (Scotland's school-register identifier), verified live. No explicit
      "illustrative only" caveat is stated on this item, unlike Sheffield's;
      treat catchment boundaries as indicative of priority admission, not a
      legal guarantee, per this project's general admissions-safety rule.

  - local_authority_code: "S12000033"
    local_authority_name: "Aberdeen City"
    academic_year: "2025-2026"
    source_type: "secondary_catchment"
    source_url: "https://spatialdata-accabdn.opendata.arcgis.com/datasets/accabdn::academy-school-catchments"
    download_url: "https://services5.arcgis.com/0sktPVp3t1LvXc9z/arcgis/rest/services/Academy_School_Catchments/FeatureServer/5"
    format: "arcgis_feature_service"
    coordinate_reference_system: "EPSG:27700"
    licence: "Open Government Licence v3.0 (contains OS data, Crown copyright and database right)"
    last_verified_at: "2026-08-02"
    parser_name: "sheffield_arcgis_feature_service"
    enabled: true
    notes: >
      14 secondary ("Academy", Scotland's term for secondary school, not to
      be confused with England's academy-trust governance model) catchment
      polygons. Same source item family as the primary layer above.

  # City of Edinburgh's non-denominational (ND) and Roman Catholic (RC)
  # catchments geographically overlap (a household can sit inside both an
  # ND and an RC catchment at once - denominational school choice is
  # separate from geographic catchment in Scotland). source_type here is
  # deliberately NOT "primary_catchment"/"secondary_catchment": those exact
  # strings are what apps/web's /admissions checker looks up
  # (PHASE_TO_SOURCE_TYPE in lib/queries/catchments.ts), and feeding it an
  # ND/RC pair under the same source_type would let it silently return
  # whichever polygon happens to match first for a household actually in
  # both, which is not a real answer. These four layers are map-overlay-only
  # for now (real, verified, licensed data - just not wired into the
  # admissions point-in-polygon check, which would need to ask "which
  # denomination" first before this can extend there.)
  - local_authority_code: "S12000036"
    local_authority_name: "City of Edinburgh"
    academic_year: "2025-2026"
    source_type: "primary_catchment_nd"
    source_url: "https://city-of-edinburgh-council-open-spatial-data-cityofedinburgh.hub.arcgis.com/datasets/cityofedinburgh::primary-school-catchments-non-denominational-"
    download_url: "https://edinburghcouncilmaps.info/arcgis/rest/services/AdminBoundaries/MiscBoundaries/MapServer/4"
    format: "arcgis_feature_service"
    coordinate_reference_system: "EPSG:27700"
    licence: "Open Government Licence v3.0 (contains OS data, Crown copyright and database right)"
    last_verified_at: "2026-08-02"
    parser_name: "sheffield_arcgis_feature_service"
    enabled: true
    notes: >
      84 primary (non-denominational) catchment polygons. Carries the real
      school name in EST_NAME, unlike Sheffield/Aberdeen - verified live
      ("Abbeyhill Primary School" etc.), matching real Scotland school
      register names closely enough to be a real future SchoolCatchmentArea
      candidate, though not attempted here (see PROJECT_STATUS.md).

  - local_authority_code: "S12000036"
    local_authority_name: "City of Edinburgh"
    academic_year: "2025-2026"
    source_type: "primary_catchment_rc"
    source_url: "https://city-of-edinburgh-council-open-spatial-data-cityofedinburgh.hub.arcgis.com/datasets/cityofedinburgh::primary-school-catchments-roman-catholic-1"
    download_url: "https://edinburghcouncilmaps.info/arcgis/rest/services/AdminBoundaries/MiscBoundaries/MapServer/5"
    format: "arcgis_feature_service"
    coordinate_reference_system: "EPSG:27700"
    licence: "Open Government Licence v3.0 (contains OS data, Crown copyright and database right)"
    last_verified_at: "2026-08-02"
    parser_name: "sheffield_arcgis_feature_service"
    enabled: true
    notes: "16 primary (Roman Catholic) catchment polygons."

  - local_authority_code: "S12000036"
    local_authority_name: "City of Edinburgh"
    academic_year: "2025-2026"
    source_type: "secondary_catchment_nd"
    source_url: "https://city-of-edinburgh-council-open-spatial-data-cityofedinburgh.hub.arcgis.com/datasets/cityofedinburgh::secondary-school-catchments-non-denominational"
    download_url: "https://edinburghcouncilmaps.info/arcgis/rest/services/AdminBoundaries/MiscBoundaries/MapServer/6"
    format: "arcgis_feature_service"
    coordinate_reference_system: "EPSG:27700"
    licence: "Open Government Licence v3.0 (contains OS data, Crown copyright and database right)"
    last_verified_at: "2026-08-02"
    parser_name: "sheffield_arcgis_feature_service"
    enabled: true
    notes: "22 secondary (non-denominational) catchment polygons."

  - local_authority_code: "S12000036"
    local_authority_name: "City of Edinburgh"
    academic_year: "2025-2026"
    source_type: "secondary_catchment_rc"
    source_url: "https://city-of-edinburgh-council-open-spatial-data-cityofedinburgh.hub.arcgis.com/datasets/cityofedinburgh::secondary-school-catchments-roman-catholic-1/about"
    download_url: "https://edinburghcouncilmaps.info/arcgis/rest/services/AdminBoundaries/MiscBoundaries/MapServer/7"
    format: "arcgis_feature_service"
    coordinate_reference_system: "EPSG:27700"
    licence: "Open Government Licence v3.0 (contains OS data, Crown copyright and database right)"
    last_verified_at: "2026-08-02"
    parser_name: "sheffield_arcgis_feature_service"
    enabled: true
    notes: "4 secondary (Roman Catholic) catchment polygons."

# ---------------------------------------------------------------------------
# Candidate sources identified but not yet enabled (require manual licence
# and format verification before flipping enabled: true). Left here so the
# next pilot expansion has a documented starting point rather than a fresh
# search. Do not enable without repeating the verification steps above.
# ---------------------------------------------------------------------------
candidates:
  - local_authority_name: "Buckinghamshire"
    reason_not_enabled: "Identified an ArcGIS MapServer (Schools_and_Gates) but licence and exact catchment vs. walking-zone semantics not yet verified."
  - local_authority_name: "Cardiff (Wales)"
    reason_not_enabled: "Only an interactive address-lookup map application (ishare.cardiff.gov.uk) was found, no downloadable dataset or documented API - explicitly excluded by this project's own 'what we deliberately do not use' rule. Other Welsh councils not yet checked."
  - local_authority_name: "Northern Ireland (all)"
    reason_not_enabled: "Confirmed (live research, 2026-08-02): the Department of Education does not hold catchment-area data centrally at all - each school sets its own admissions/enrolment criteria, and NI's 'school planning areas' are a demographic planning concept, not a catchment boundary. There is nothing to source here, not a research gap."
