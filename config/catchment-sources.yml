  # North East Lincolnshire: previously logged as a dead end ("only official
  # catchment artifact is a plain PDF list, not even a map") - reopened per
  # this session's established pattern (Coventry/Wirral/Luton) that a real
  # road-to-school text mapping is membership data the Voronoi-reconstruction
  # pipeline can turn into geometry, not a non-starter just because it isn't
  # already a map.
  #
  # Source: nelincs.gov.uk/assets/uploads/2025/09/School-catchment-list.pdf,
  # a genuine 54-page, machine-generated (Excel-exported) borough-wide table
  # - "Correct @ July 2025" - covering every named road split into house-
  # number spec / road+town / primary catchment / secondary catchment
  # columns, extracted cleanly via pdfplumber's table extraction (no OCR
  # needed; real embedded text throughout).
  #
  # Parsing: 2,912 raw table rows across 54 pages. Excluded: 195 rows
  # carrying an explicit house-number range/parity split in the house-number
  # column (e.g. "1-55 (Odd numbers) & 2-34 (Even numbers)") per this
  # project's standing rule against guessing a number-range's position along
  # a road without real proportional-interpolation geometry; 6 rows in a
  # separate "Addresses outside of North East Lincolnshire" section (roads in
  # neighbouring LAs whose primary catchment is literally "contact the LA
  # mentioned" rather than a real school). 2,701 unique whole-road,
  # single-claim rows remained (16 of them had their road name glued into the
  # house-number cell by a pdfplumber line-merge quirk on short cells -
  # recovered by stripping the "All Numbers " prefix rather than dropped).
  #
  # Name matching: 43 unique primary-column strings and 10 secondary-column
  # strings, resolved against every real OPEN North East Lincolnshire school
  # (local_authority_code 812) by exact/near-exact normalised-name match, not
  # string-similarity guessing. Caught two real traps: some "X & Y" strings
  # are two DIFFERENT schools genuinely sharing one catchment (e.g. "Waltham
  # Leas Primary Academy & Waltham Gateway Academy", "Scartho Infants School
  # & Scartho Junior Academy & Scartho Gateway Academy" - a real 3-way
  # infant/junior/gateway split, all fed the identical road set per this
  # project's standing sister-school convention), while others are ONE
  # school's own official name that happens to contain "&" (e.g. "Stanford
  # Junior & Infant School" = the single school now named "Laceby Stanford
  # Primary Academy", "Thrunscoe Primary & Nursery Academy" = one school) -
  # distinguished by trying a direct single-school match first and only
  # falling back to an &-split if the whole string didn't match one real
  # school. One further real exclusion: "Killingholme Primary School (North
  # Lincolnshire LA)" is explicitly a neighbouring authority's own school
  # (confirmed in the DB under local_authority_code 813, sited well outside
  # North East Lincolnshire's boundary) - the 28 Habrough-area roads naming
  # it as primary catchment were excluded from primary reconstruction (their
  # secondary claim, Oasis Academy Immingham, is a real NE Lincs school and
  # was kept).
  #
