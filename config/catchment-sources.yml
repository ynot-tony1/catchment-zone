  # threshold can't distinguish "fill over an orange building" from
  # "a plain orange building" outside the fill) - instead traced from a
  # distinct dark reddish-brown border stroke drawn around the fill's
  # own edge, isolated by an (R>G, R>B, dark) colour test, with small
  # interior holes (mostly the school's own building footprint, a
  # cartographic artefact rather than a real exclusion) closed via
  # contour hierarchy before the final external contour. All 4 new
  # polygons verified: Mudeford, Old Town and Bishop Aldhelm's Parish
