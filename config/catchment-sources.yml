  # Luton: secure.luton.gov.uk/catchment/ is a jQuery Mobile road-name search
  # page whose backing lbc.js fetches the ENTIRE underlying dataset in one
  # request as catchment.tsv (a flat 3-column tab-separated file: road name,
  # primary catchment-area name, secondary school name) - client-side
  # filtering on keyup, same "return the whole table in one call" shape as
  # Wirral's search tool, just already flat-file rather than POST-triggered.
  # Previously logged as a dead end ("no geometry of any kind, fails the
  # polygon requirement entirely") because the file itself carries no
  # coordinates - re-investigated this session per the standing instruction
  # that a road/school text mapping is real membership data the Voronoi
  # pipeline can turn into geometry, exactly like Coventry/Wirral.
  #
  # Harvest: single GET of catchment.tsv, 1,900 rows, cp1252-encoded (not
  # UTF-8 - contains a Windows-1252 apostrophe). No auth, no rate limiting.
  #
  # Parsing: 143 of 1,900 rows carry an explicit house-number range/parity
  # split in the road-name column itself (e.g. "Addington Way  1 - 29" vs
  # "Addington Way  31 - end", "Biscot Road 1-89 odds only") - EXCLUDED per
  # this project's standing rule against guessing a number-range's position
  # along a road without real proportional-interpolation geometry. A further
  # 153 rows carry a "/"-joined dual catchment-area or dual-school claim in
  # the primary or secondary column (e.g. "Whipperley/Farley", "Denbigh/
  # Icknield") after stripping "[Ward for The Linden Academy: ...]"
  # annotations (a secondary-academy-specific admissions-ward note bolted
  # onto the primary column, not itself a second claim) - EXCLUDED for the
  # same reason Wirral excluded its dual-"Catchment school N" roads: a single
  # point sample can't represent two schools' claims on the same road. No
  # road name repeats with a conflicting claim anywhere in the raw 1,900
  # rows (checked exhaustively). 1,604 unique whole-road, single-claim rows
  # remained.
  #
  # Name matching: Luton's primary column is a named catchment AREA (e.g.
  # "Crawley Green", "Hillborough"), not always a literal single school name -
  # resolved to real OPEN Luton schools (local_authority_code 821) by exact/
  # near-exact name match against the DB, not string-similarity guessing; all
  # 34 primary and all 10 secondary catchment-area names matched cleanly.
  # Five primary areas ("Ferrars", "Hillborough", "Someries", "Warden Hill",
  # "William Austin") and one secondary area ("Challney") are genuinely
  # shared by two same-named-family sister schools each (infant+junior pairs
  # 30m-122m apart, all co-located per their own DB coordinates, confirmed
  # individually rather than assumed; and Challney High School for Boys/Girls,
  # a real gender-split pair sharing one catchment 388m apart) - both URNs
  # were fed the identical road set per this project's standing convention for
  # genuine same-catchment sister-school splits (already used for Redcar/
  # Cleveland and Wirral's infant/junior pairs).
  #
  # Geocoding: 1,604 unique whole-road strings queried against Nominatim's
  # public search endpoint, ~1 req/sec, structured as "<road>, Luton, UK"
  # with a Luton-sized viewbox and bounded=1; 1,287 resolved (80%).
  #
  # Reconstruction: identical Voronoi-tessellation-plus-trust-radius-clip
  # method as Hartlepool/Essex/Wakefield/Coventry/Wirral - tessellated
  # separately by phase (primary areas and secondary schools don't compete
  # for the same Voronoi space), dissolved by school, clipped to the real
  # Luton LAD boundary (ONS Open Geography Portal, LAD_MAY_2025_UK_BFC_V2,
  # E06000032) and a 300m trust-radius buffer around every real geocoded
  # sample point (same radius as Coventry/Wirral, matching Luton's similarly
  # compact built-up-area density).
  #
  # Verification: this file's standard 100m own-school-coordinate-margin bar,
  # independently re-checked after generation. Of 37 primary schools with at
  # least 4 geocoded points, 16 cleared the bar (margins 105m-336m); of 11
  # secondary schools, 4 cleared (margins 109m-164m). The rest failed
  # (several by a wide margin, e.g. both Challney schools, Denbigh High
  # School, several Infant/Junior sister pairs) and were excluded rather than
  # force-deployed - consistent with this being a denser urban unitary where
  # many schools sit close together, leaving less real margin for a
  # point-sample reconstruction to clear even when the underlying data is
  # accurate (same pattern already seen at Wirral).
