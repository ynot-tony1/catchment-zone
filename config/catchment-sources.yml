      environment even with a browser User-Agent and a Referer header set;
      the GeoServer admin UI at the same host loads fine, so this looks like
      a deliberate restriction on the data workspace specifically, not a
      general network block. Worth trying again from a different network
      origin (e.g. the user's own machine, matching the GIAS/Azure-block
      workaround pattern) before spending more effort on individual councils.
