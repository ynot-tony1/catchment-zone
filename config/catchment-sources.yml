  # Leeds secondary: only 5 of Leeds's ~30 secondary schools have a
  # defined priority catchment area at all (per the council's own
  # "2023 Catchment Maps for Secondary.pdf") - the rest use distance-based
  # admissions with no catchment concept, a real structural fact, not a
  # gap in this digitisation. Of those 5, 4 use the same line+marker+ruler
  # template as the primary maps (one, Allerton Grange, in black; two,
  # Benton Park and Roundhay, also black; Lawnswood uniquely draws its
  # boundary in blue rather than black - the extractor tries both colours
  # per page). The 5th (Allerton High School) shows two semi-transparent
  # filled priority zones with no outline stroke at all - initially left
  # as an open candidate, later solved with a fill-colour-region technique
  # instead of line-tracing: since the fill is alpha-blended over the
  # OS basemap, its exact RGB varies by whatever basemap feature sits
  # underneath, but the (B-R) channel difference for Zone 1's blue tint
  # and (R-B) for Zone 2's orange tint both come out as an almost
  # perfectly constant additive shift (~+45) regardless of the underlying
  # base colour (verified against the legend's own swatches, rendered
  # over white, and several in-map sample points over white/green/urban
  # basemap) - because most basemap colours are close to colour-neutral
  # (R≈G≈B), the alpha-blend's dominant effect on (B-R)/(R-B) is the
  # additive term, not the multiplicative one. Thresholding each channel
  # difference at >25, keeping only the single largest connected
  # component (a thin river with a similar blue cast was initially
  # misclassified as part of Zone 1 - removed via morphological opening,
  # which strips thin linear protrusions but preserves the filled zone
  # blob), then extracting/simplifying the contour the same way as every
  # other digitised source. Georeferenced with this project's usual
  # single-marker + scale-bar method (marker: a teal circle icon, colour-
  # matched and centroided, excluding an identical decoy icon in the
  # legend; scale bar: 9 tick marks at exactly 0.375-mile spacing,
  # cross-verified against the "0"/"0.75"/"1.5"/"3 Miles" text labels'
  # own bounding boxes). Allerton High's own marker sits almost exactly
  # on the Zone 1/Zone 2 boundary (48-71m outside either polygon, within
  # this method's expected precision at this map's ~5m/pixel resolution)
  # - not treated as a data error and both zones kept, since this map's
  # zone identity comes from its own printed labels, not from a school-
  # inside-polygon inference the way pooled/shared catchments elsewhere
  # in this registry are matched. Visually verified pixel-perfect via a
  # full contour overlay redrawn onto the source render. This page's PDF
  # also breaks
  # this project's usual "collapse all whitespace, regex the scale label"
  # reading (used successfully for the primary maps) whenever a tick
  # value reaches 1 or more, e.g. "0.75" immediately followed by "1.5"
  # collapses to the ambiguous "0.751.5" - fixed by cross-referencing the
  # PDF's own word bounding boxes (pdftotext -bbox) against the already
  # pixel-detected ruler position instead of relying on text reading
  # order, which is unreliable on these exports.
