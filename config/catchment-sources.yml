  # Hertfordshire: a real, live, current ArcGIS MapServer
  # (appservices/SchoolParishes, found by browsing the council's own GIS
  # server folder listing - gis.hertfordshire.gov.uk/webmaps/rest/services
  # - after a "school catchment" web search surfaced only its unrelated
  # SEN-areas service) - but structured completely differently from
  # every other source in this file: one polygon per CIVIL PARISH, not
  # per school, each carrying which secondary school(s) hold admissions
  # priority there. Most of Hertfordshire's secondary system is
  # genuinely not catchment-based at all (each parish's COEDINFO field
  # lists several co-ed schools sharing that priority pool, allocated by
  # distance/siblings within it, not an exclusive zone - the same
  # "shared pool, no single exclusive catchment" pattern already
  # excluded elsewhere in this project, e.g. Barnsley) - correctly
  # skipped, not digitised, since drawing one exclusive polygon per
  # co-ed school there would misrepresent a real shared-pool system as
  # an exclusive one. Hertfordshire's SEVEN single-sex selective
  # (grammar) schools are different: each parish's BOYS/GIRLS fields
  # name exactly one school (or "Not Applicable"), a genuine exclusive
  # priority area - dissolved into one polygon per school by unioning
  # every parish naming that school (148 parishes total; one parish,
  # Aldenham, is a bordering pair with both a BOYS and a GIRLS entry,
  # counted toward both). Verified every one of the 7 schools' own real
  # coordinate falls inside its own dissolved polygon before writing
  # out. This is a genuine transform of real published per-parish
  # admissions-priority data, not invented geometry - recorded under a
  # distinct source_type (not plain secondary_catchment) specifically so
