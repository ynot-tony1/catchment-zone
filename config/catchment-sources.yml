      (-7.557, 49.767, nowhere near North Yorkshire) - caught immediately
      via the post-import envelope sweep, all 332 corrupted rows deleted
      and re-imported clean with EPSG:4326 declared instead. The lesson:
      for any source whose response omits an explicit crs block, declare
      whatever CRS the adapter's actual query returns, not the service's
      undecorated default.

