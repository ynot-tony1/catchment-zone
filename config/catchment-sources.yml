  # Oxfordshire: no GIS/API (ArcGIS Server fully enumerated with nothing
  # relevant; a FOI request for the data was refused), but every school
  # has its own "Location and Designated Area" PDF at a predictable URL
  # keyed by the same numeric code the council's own school-directory
  # pages use - see the candidates: entry below for the URL pattern and
  # exact coverage numbers (75 of 307 schools digitised so far). Unlike
  # every other digitised source in this file, these PDFs need no scale
  # bar and no manually-read value at all: they're built on an OS
  # 1:1250-raster basemap with a real 1km Ordnance Survey grid printed
  # on it (cyan lines), and a grid square is exactly 1000m by definition
  # - far more precise than a hand-measured scale bar. The grid's pixel
  # spacing was found via autocorrelation of the cyan pixel count per
  # column/row rather than simple thresholding, because dense map detail
  # (roads, building outlines, text) breaks individual grid lines up in
  # different places on every file, making a naive per-column pixel-count
  # threshold unreliable; autocorrelation recovers the periodic spacing
  # from the signal as a whole even when no single grid line is fully
  # intact. That spacing, plus the school's own real coordinate (already
  # in this project's schools table) anchored to its marker's pixel
  # position, gives the full transform - no scale bar needed. One real
  # template quirk found and handled: primary schools' boundary+marker
  # are drawn in blue, secondary schools' in red - the extractor tries
  # both colours per file. Verified pixel-perfect against Didcot Girls'
  # School before running at scale; every polygon was also checked to
  # actually contain its own school's real coordinate.
  #
  # 2026-08-08 update: the ~28 grid-template files that had previously
  # failed the autocorrelation confidence check were revisited with two
  # fixes, not just a lower threshold. (1) The autocorrelation peak
  # search was picking a harmonic (2x/3x/4x the true grid spacing) over
  # the fundamental on some files, since a harmonic's peak can outscore
  # the fundamental's - fixed by taking the smallest period among all
  # peaks within 50% of the tallest peak's height, not just the single
  # tallest. (2) Marker-icon selection previously took the first
  # plausible small coloured blob in raster-scan order, which could pick
  # an unrelated small feature elsewhere on the page (e.g. a highlighted
  # building outline near a different village) instead of the school's
  # own marker - fixed by requiring the candidate marker's centroid to
  # fall inside the boundary polygon's own filled interior, then taking
  # the largest such candidate (real marker icons are consistently
  # bigger than the small blobs of noise - dash/text-edge fragments -
  # that also land inside the polygon by chance). Both fixes were
  # verified by re-deriving full contour overlays for several files
  # (Benson CE Primary, The Marlborough CE School, John Blandy Primary,
  # The Bicester School, Sonning Common Primary) and visually confirming
  # the traced boundary matches the source PDF's own line pixel-for-
  # pixel and the marker lands on the school's own icon, not just that
  # the resulting polygon happens to contain the school's coordinate
  # (which is true by construction for any in-polygon marker choice and
  # so cannot alone prove the marker was the *right* one). Of the ~28
  # candidates, 36 files actually turned out gridded once re-examined at
  # 150dpi (some of the original ~28 count was approximate); 35 were
  # digitised this pass, 1 (Dry Sandford Primary School) skipped - its
  # true marker icon is only ~3px at this render resolution, too small
  # to distinguish from noise with this method.
  #
  # A second, newer (2011-2014+) Oxfordshire PDF template - cream/yellow
  # OS-OpenData-style basemap, no cyan grid, no scale bar - was
  # previously undigitised (~91 candidate files). A working method was
  # found and proven on 3 real schools this pass (Orchard Meadow Primary,
  # Oxford Spires Academy, Cheney School - all verified pixel-perfect via
  # contour overlay): the boundary+marker are still real vector-drawn
  # lines/icons in a distinctive saturated blue (RGB roughly B>150,
  # R<100, G<100), extractable via connected-component labelling - the
  # marker is always a small (~20x20px at 200dpi) compact component,
  # trivially distinguished from the long thin boundary-line component by
  # size/aspect ratio. The marker's pixel position is anchored to the
  # school's own real coordinate (already in this project's schools
  # table), exactly as the grid template does. The missing piece is
  # scale+rotation, since there's no grid or scale bar: this template's
  # street/place-name labels are raster image content, NOT real
  # pdftotext-extractable text (confirmed: only the title and copyright
  # footer are real text), so they must be read visually. North-up was
  # verified true (not just assumed) on both test files by checking a
  # second real landmark's bearing from the school against its true
  # geographic bearing (agreed within 0.3-3.5 degrees both times) -
  # still, checking this per file rather than assuming it is the safer
  # practice this method establishes. Scale (metres/pixel) is NOT
  # constant across files - confirmed by measuring it independently on
  # two schools with different real-world catchment sizes (1.070 m/px
  # for a small primary catchment on an A4 page; 4.234 and 5.572 m/px
  # for two large secondary catchments on A3 pages) - the council's
  # export tool evidently fits each school's own real designated-area
  # extent to the page individually, not a fixed print scale, so each
  # file needs its own second landmark, not a shared constant. The
  # second landmark can be any real, precisely locatable feature visible
  # on the map that a human reviewer can read and geocode (e.g. via OSM
  # Nominatim) - a named venue, a park-and-ride, a distinctive roundabout
  # - the further from the school marker the better (a longer pixel
  # baseline reduces relative measurement error; the ~1600px baseline
  # used for Orchard Meadow show a much larger bearing residual than the
  # ~1400-1570px baselines used for the two secondary schools). The same
  # real landmark (a roundabout near Water Eaton/Gosford, north Oxford)
  # was reusable across both secondary-school files this pass since they
  # shared a similar Oxford-wide extent - worth checking whether a
  # school's neighbours share a landmark before hunting for a new one
  # each time. This method is real, working, and provenly accurate, but
  # inherently a per-file manual process (finding and geocoding a second
  # landmark isn't yet automated) - only 3 of ~91 candidate files done
  # this pass; a future session should continue applying this exact
  # method rather than re-deriving it.
  #
  # 2026-08-08 addendum: 6 more non-gridded files digitised, refining the
  # landmark source rather than the transform method itself. Two
  # landmark sources proved more reliable than hunting for a named venue
  # from scratch: (1) ANOTHER real school already in this project's own
  # schools table (GIAS-sourced, so no external geocoding uncertainty at
  # all) - e.g. Brookside Primary's catchment was anchored using Bure
  # Park Primary School's real coordinate and its clearly-drawn building
  # footprint on the same map; (2) a named bridge/road-junction/
  # roundabout resolved via Overpass (a `way["junction"="roundabout"]`
  # or `node["highway"="motorway_junction"]` query near the map's rough
  # area) rather than Nominatim's place search, which repeatedly failed
  # or returned village-level (too imprecise) results for these small
  # named features - Nominatim only reliably resolved well-known
  # national landmarks (e.g. Blenheim Palace). One real failure mode
  # found and worth flagging: a short pixel baseline (~600-650px, one
  # candidate landmark ~800m from the school) amplifies bearing residual
  # from small pixel misreads far more than a long one - two attempts
  # with sub-1000px baselines gave 7+ degree residuals (rejected, over
  # this project's 5-degree cutoff) versus 0.1-3.5 degrees for baselines
  # over 1200px, confirming the existing guidance to prefer the farthest
  # identifiable landmark rather than the nearest. The same real
  # landmark (Tadpole Bridge, on the Thames) was reused across two
  # different schools' files (Bampton CofE Primary, Buckland CE Primary)
