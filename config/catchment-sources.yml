    last_verified_at: "2026-08-07"
    parser_name: "generic_geojson"
    enabled: true
    notes: >
      39 primary catchment polygons digitised by this project from BCP's
      published per-school PDF maps (29 from QGIS exports, 2021; 3 more -
      Baden-Powell and St Peter's, Livingstone Road Infant, Manorside -
