  # Wakefield: the existing candidate note (removed by this session, was in
  # candidates: below) correctly identified this as the Hartlepool/Essex
  # point-sampling shape of problem, and correctly flagged it as easier
  # than either: the council's "pick address for school catchment" tool
  # returns real British National Grid coordinates (e=/n= query params)
  # embedded directly in each address link, so no separate geocoding or
  # postcode-centroid approximation step was needed at all (unlike
  # Hartlepool/Essex, which both classified UPRNs with no coordinates of
  # their own). Two plain GET endpoints, no auth/session/CAPTCHA on either
  # (confirmed live): (1)
  # wakefield.gov.uk/pick-address-for-school-catchment?where-i-live={postcode}
  # returns an address list, each a link carrying uprn, usrn, e, n, p; (2)
  # wakefield.gov.uk/schools-and-education/schools/school-catchment-area-search?uprn=...&e=...&n=...&p=...
  # returns a "Your catchment area schools" section naming the real primary
  # and secondary school for that address, or "No addresses found"/no
  # section at all where none is defined. A second "Your nearest Roman
  # Catholic schools" section is an explicit nearest-distance calculation
  # ("Distance: 0.44 km"), not real RC catchment membership, and was
  # deliberately NOT treated as a catchment zone here - only the "Your
  # catchment area schools" section was harvested.
  #
  # Sampling: doogal.co.uk's AdministrativeAreasCSV export
  # (?district=E08000036) gave every postcode in Wakefield MDC - 12,277
  # total, 9,676 in use. Queried both endpoints for every in-use postcode
  # (an exhaustive canvas, like Hartlepool, not a stratified sample like
  # Essex's larger county) - about 50 minutes at concurrency 16. Result:
  # 8,968 postcodes resolved to a real address (708 had no address match or
  # a transient error, including a run of genuine 403s on a handful of
  # non-residential/commercial-unit addresses - excluded, not guessed at),
  # classified into 85 distinct primary-school names and 16 distinct
  # secondary-school names by the tool's own text.
  #
  # Name matching: the tool's harvested school names don't share an ID with
  # this project's own schools table (the "DFEE" number in its result links
  # is a Wakefield-internal code, not a DfE URN), so matching was done by
  # normalised name against this project's own OPEN Wakefield schools
