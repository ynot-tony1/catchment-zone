  # Inverclyde: previously a documented dead end (see the candidates:
  # history preserved below for the original session's finding) - a 3/4-
  # point affine fit using geocoded place-name label positions (Greenock,
  # Port Glasgow, Dumbarton Castle, Dunoon) had too large a residual to
  # trust, landing several schools in the wrong neighbouring zone
  # entirely. Solved this session with the fix idea that note left for a
  # future attempt: the source PDF (Inverclyde-School-Catchments.pdf, a
  # genuine Cadcorp SIS Map Modeller vector export - confirmed via
  # PyMuPDF page.get_drawings(), each catchment a real filled/stroked
  # vector path, not a raster/schematic image) has real OS 1km grid
  # lines printed in its basemap at a single consistent RGB(204,204,204)
  # against an RGB(233,233,233) background, distinguishable with a tight
  # colour-band mask. Column-sum and row-sum profiles of that mask spike
  # sharply at the true grid-line pixel columns/rows (a cleaner signal
  # than Oxfordshire's autocorrelation-only approach needed, since here
  # the exact line colour is known and consistent across the whole
  # document); measured spacing was 101.5px/km at 200dpi, identical to
  # the pixel across two independent long baselines (609px over a 6km
  # easting run, 406px over a 4km northing run) and identical between
  # the x and y axes - confirming uniform scale with no distortion. The
  # grid's own printed two-digit labels (the last two digits of each
  # line's true OSGB36 easting/northing, standard OS convention) were
  # read directly off the rendered page and cross-checked against this
  # project's own DB coordinates for Greenock/Port Glasgow/Gourock
  # reprojected to EPSG:27700 with pyproj - e.g. grid column "32"
  # (easting 232000) sits almost exactly on Port Glasgow's real
  # projected easting (232058), and the PORT GLASGOW label is printed
  # exactly where that grid intersection predicts on the page. The
  # compass rose confirms north-up, and the grid lines themselves are
  # perfectly axis-aligned in the render, so no rotation term was
  # needed - just scale plus a single absolute offset per axis, no
  # diffuse multi-landmark averaging like the rejected first attempt.
  # All 4 pages of the PDF (primary denominational, primary non-
  # denominational, secondary denominational, secondary non-
  # denominational) share the exact same map extent and grid (confirmed
  # by matching detected grid-line pixel positions across all 4 pages),
  # so one derived transform served the whole document. Each page's
  # filled catchment polygons were matched to their school by exact
  # fill-colour lookup against that page's own printed legend swatches
  # (9-11 distinct colours per page, e.g. St Andrew's = RGB(255,255,
  # 178), St Michael's = RGB(179,221,105)). Every single one of the 26
  # zones across all 4 pages was verified to contain its own real DB
  # school coordinate (reprojected to EPSG:27700 for a true-distance
  # check, not degrees) - margins to the nearest zone boundary ranged
  # from 56m (Moorfoot Primary, the tightest) to 1365m (Port Glasgow
  # High School/St Stephen's High School, a genuinely shared-campus
  # coordinate used on two different pages), with most in the 150-600m
  # range - no zone was even close to a coin-flip case. Licence: as
  # printed in the PDF footer, "This material has been reproduced from
  # Ordnance Survey digital map data with the permission of the
