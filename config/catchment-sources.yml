  # Shetland Islands: previously a dead end (fully rasterised PDF, no
  # vector text/lines at all - see the "candidates" history preserved
  # below this council's old entry search trail elsewhere in this file's
  # git history). Solved across two sessions: (1) a 26-point least-squares
  # affine fit (pixel -> lon/lat) built by matching each of the map's
  # coloured marker dots to its adjacent printed "X feeds to Y" label,
  # read directly off the 150dpi raster (RMS residual 126m, cross-checked
  # against the PDF's own printed 1:150000 scale to within 0.5%); (2) zone
  # polygon extraction via competitive nearest-fill-colour classification
  # (each land pixel assigned to whichever of the ~27 zones' sampled
  # reference tint is closest) rather than this project's usual line-
  # network watershed, since these zones are semi-transparent colour
  # tints alpha-blended over a full OS basemap with no clean boundary
  # lines to trace. A naive single-pass version of this produced
  # "confetti" - several zones on this map reuse near-identical fill
  # hues for non-adjacent areas, so pure per-pixel colour competition let
  # a zone win small pockets of unrelated territory elsewhere on the map.
  # Fixed with a confirm-then-regrow pass: for each zone, keep only the
  # connected component of its colour-classified pixels that actually
  # contains its own seed dot(s) as "confirmed" territory, discard
  # everything else, then re-fill all unclaimed land purely by nearest-
  # neighbour distance to the confirmed regions (a spatial regrow immune
  # to further colour collisions). Sea/coastline itself was separated
  # first by its own highly consistent pale-blue colour (independent of
  # the zone-vs-zone problem), with thin overlay artefacts (OS grid
  # lines, place-name text, the north arrow, "SIC" watermark) stripped by
  # morphological opening before coastline extraction, since those are
  # non-sea-coloured but span open water and would otherwise inflate the
  # land mask. Verified every one of the 25 zones with a real DB school
  # match: after vectorising (rasterio polygonize + light smoothing +
  # Douglas-Peucker simplify) every resulting polygon contains its own
  # school's real DB coordinate (shapely .contains, not just a pixel
  # check). "Sound & Bells Brae feeds to Anderson High School" is one
  # genuine shared zone covering two schools (Sound Primary and Bell's
  # Brae Primary, both real, separate, open DB schools ~560m apart on
  # the map) - handled by this project's existing same-geometry-checksum
  # merge logic in build_catchment_areas, exactly as Middlesbrough's
  # shared zone was. Fetlar, Papa Stour and Out Skerries are drawn on the
  # map with their own zones but excluded (as before) since none has a
  # currently-open DB school. Fair Isle's inset has its own separate
  # scale with no OS grid of its own to re-anchor, so it was not put
  # through the same pixel pipeline at all - since it's a single-school
  # island where the whole island is definitionally the catchment, its
  # real OSM/Nominatim coastline polygon (osm relation 3067410) was used
  # directly instead, verified to contain Fair Isle Primary School's own
  # DB coordinate.

