candidates:
  - local_authority_name: "Bedford"
    reason_not_enabled: >
      No real catchment-polygon GIS presence found. An ArcGIS Online item
      titled "Bedford Borough Council School Catchment Map" (owned by an
      Esri UK education/training org, khall@esriuk.com_EsriUkeducation)
      looked promising and does reference genuine Bedford Borough Council
      data (LLPG address points, real school locations/roll numbers by
      year), but its only layers are point geometry - no catchment
      boundary layer exists in it despite the title. That org's wider
      service catalogue (services.arcgis.com/XSeYKQzfXnEgju9o) is a large
      shared student/training space with hundreds of unrelated services
      (river catchments, other councils' data, dissertation projects) -
      not evidence of a real Bedford catchment layer elsewhere in it. Both
      candidate open-data hub hostnames (bedfordborough-opendata and
      bedford-opendata .hub.arcgis.com) are live but return zero datasets
      via DCAT feed. No catchment/admission links found via the council's
      own site search or its schools-education-and-childcare hub page. No
      Bedford-specific dataset found on data.gov.uk search either.
  - local_authority_name: "Bradford"
    reason_not_enabled: >
      The council's own ArcGIS Server (found by browsing
      cbmdc.maps.arcgis.com's org content directly, since
      gis.bradford.gov.uk redirects there) hosts "PrimaryPA_2025" and
      "SecondaryPA" polygon FeatureServers that looked promising from
      their names, but their actual features are named "Keighley North",
      "Wharfe Valley West", "BD5 Outer", "Aire Valley", etc. - these are
      school-place-SUFFICIENCY PLANNING areas (large multi-school
      demographic zones the council uses for capacity planning, matching
      "Bradford District Primary Summary"'s 26 planning areas), not
      per-school catchment/priority-admission boundaries. Deploying them
      as if they were school catchments would misrepresent what they
      actually are - each zone covers many schools' worth of area with no
      link to which specific school gets admissions priority there. A
      genuine "School Catchments 2026" ArcGIS Experience app surfaced in
      search (experience.arcgis.com/experience/3f98912c9da44d8c919f50c1525ac813)
      but its own item metadata confirms the owner is "Telford" (Telford
      and Wrekin Council, already covered elsewhere in this file), not
      Bradford - a false positive from search relevance, the same pattern
      already seen for Manchester/Portsmouth/Birmingham search results
      surfacing other councils' generically-titled apps.
  - local_authority_name: "Manchester"
    reason_not_enabled: >
      The "schools and catchment areas" ArcGIS Experience app that
      surfaces in search (experience.arcgis.com/experience/4dd5b97eae514b31a067137ebf7cdd6a)
      is the same app already confirmed via its own item metadata to
      belong to North Yorkshire (already covered elsewhere in this
      file), not Manchester - a false positive from generic search
      relevance, not a real lead. No further search attempted this
      session; genuinely unchecked beyond this one false lead.
  - local_authority_name: "Birmingham (community schools)"
    reason_not_enabled: >
      Birmingham City Council's own community/voluntary-controlled
      schools use distance/priority-area admissions with no published
      catchment polygons found (only individual proposed-catchment PDFs
      for specific consultation schools, e.g. King Edward VI Five Ways'
      own council-side consultation map, which duplicates data already
      covered by the King Edward VI Foundation source above). The
      "School Catchment Areas" ArcGIS Experience app that surfaces high
      in search (experience.arcgis.com/experience/de7992d0efe34b1c99c319f39addf3c9)
      is a false-positive lead confirmed via its own item metadata to
      belong to Wokingham Borough Council (owner WBC_JamieClarkson,
      extent centred on Wokingham, not Birmingham), already covered
      elsewhere in this file - not a Birmingham source despite the
      generic title.
  - local_authority_name: "Lincolnshire"
    reason_not_enabled: "Only the county's grammar schools have anything catchment-like (the rest are distance/priority-based with no exclusive zones), and even those genuinely aren't published online: Alford Queen Elizabeth's and Caistor Grammar both state their catchment map is only viewable at the school/open evening, not published digitally; Spalding High explicitly has no catchment area at all; Louth King Edward VI references a 'traditional catchment area' by named feeder primary schools, not a map. The council's own 'Find my nearest school' ArcGIS Experience app (experience.arcgis.com/experience/71fb40072b9945f0a4171320c331221f) is backed by a real FeatureServer (FindMyNearestFullSchoolList) but it's point geometry (school locations for a distance calculation), not catchment polygons. Caistor's rule (6.5 miles straight-line from a fixed point) is precise enough to construct as an exact circle if this ever becomes worth doing, but that's a materially different technique from every other source in this file and wasn't pursued for a single school."
  - local_authority_name: "Lewisham"
    reason_not_enabled: 'The council''s real GIS platform ("MapThat" at lbl.dynamicmaps.co.uk/MapThatWeb/login.html?user=lewisham) is genuinely login-gated (returns a real login page requiring credentials) - a hard stop per this project''s standing rule against bypassing access control, not attempted further.'
  - local_authority_name: "Enfield"
    reason_not_enabled: 'Both candidate ArcGIS Hub org hostnames (enfield-opendata.hub.arcgis.com, enfield.opendata.arcgis.com) return a 401 "private org, not accessible" - locked, not pursued further per instructions not to bypass access control. Only per-school PDF maps found otherwise.'
  - local_authority_name: "Kingston upon Thames"
    reason_not_enabled: "Has a real, fully public, working StatMap WFS platform (kingston.statmap.co.uk/map/wfs.svc/open_data_wfs, GetCapabilities confirmed live, no auth) with 20 real layers (allotments, conservation areas, green belt, tree preservation orders, etc.) - but no school catchment layer exists among them (school_open_spaces is playing-field polygons, not catchments). Catchment info exists only as a schematic PDF. Worth periodically re-checking this specific WFS in case a catchment layer is ever added, since the platform itself is already proven reachable and working."
  - local_authority_name: "Derbyshire"
    reason_not_enabled: >
      Confirmed via a live Playwright session against the "Derbyshire
      Mapping Portal" (maps.derbyshire.gov.uk, Precisely/MapInfo
      Exponare/Connect architecture) that the real per-table REST path
      pattern is
      connectProxy/rest/Spatial/ProjectService?url=/projects/Analyst/NamedProjects/{name}.json,
      revealed by the public "Ordnance_Survey_Maps" project's own real
      table names (Village_Greens, SSSIs, Libraries, DCC_Assets, etc.).
      The full public projects list
      (.../ProjectService?url=/projects.json) has only 6 entries, none
      education-related. Probing a plausible "Education" project name
      directly returns a genuine
      com.pb.spectrum.spatial.component.acl.AccessDeniedException
      ("Access denied - /Analyst/NamedProjects/Education [EXECUTE]")
      rather than a not-found error - confirming the project exists but
      is access-controlled. This is a real authentication/authorization
      wall, not an undiscovered URL - a hard stop per this project's
      standing rule against bypassing access control, not attempted
      further. The council's separate "Normal Area Finder" tool does
      point-in-polygon matching entirely server-side (ASP.NET postcode
