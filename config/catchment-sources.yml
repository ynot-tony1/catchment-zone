      import: coordinate_reference_system was initially declared as
      EPSG:27700 (this service's native default CRS with no outSR
      param), but the ingestor's own arcgis_feature_service adapter
      always requests outSR=4326 - and this particular service's geojson
      response omits the crs block entirely (confirmed live: no "crs"
      key at all), so detected_wkid comes back None and the pipeline
      fell back to the declared value. With EPSG:27700 declared, the
      already-correct WGS84 coordinates got reprojected a second time as
      if they were raw BNG eastings/northings, collapsing every
      catchment's bbox to a few centimetres around the BNG false origin
      (-7.557, 49.767, nowhere near North Yorkshire) - caught immediately
      via the post-import envelope sweep, all 332 corrupted rows deleted
      and re-imported clean with EPSG:4326 declared instead. The lesson:
      for any source whose response omits an explicit crs block, declare
      whatever CRS the adapter's actual query returns, not the service's
      undecorated default.

