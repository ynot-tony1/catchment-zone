  # Salford: the existing candidate note ("per-school PDF maps... community
  # primaries reportedly have no catchments at all") was technically true but
  # undersold the source, the same lesson learned on Suffolk this session -
  # the council's real "parish boundary and catchment area maps" page
  # (salford.gov.uk/schools-and-learning/schools-admissions/parish-boundary-and-catchment-area-maps)
  # links 24 individual per-school PDF boundary maps (RC/CE faith schools'
  # real parish catchments, not "no catchments"). Each is a genuine OS
  # OpenData-style vector basemap with a real, precise pale-cyan 1km
  # National Grid overlay (true north-up, confirmed by perfectly horizontal/
  # vertical grid lines with matching spacing on both axes) and a solid black
  # hand-drawn boundary line plus a blue star marking the school itself -
  # the same landmark-pair/OS-grid family of technique already proven for
  # Oxfordshire and Inverclyde, but with the grid itself supplying scale and
  # rotation directly (no landmark pair needed for those two), leaving only
  # one real per-file question: absolute translation. Solved by anchoring on
  # each school's own already-known-precise DB (GIAS) coordinate matched to
  # its own drawn blue star - not circular for accuracy purposes, since scale
  # and rotation come independently from the grid's own measured pixel
  # spacing, not from the school. Where a second real landmark was available
  # (another named school drawn on the same page, matched to its own DB
  # coordinate the same way this project used Oxford Brookes/St Joseph's for
  # New Marston Primary), the fit was independently cross-checked: Christ
  # Church CofE Primary via New Park Academy's own main building (Green
  # Lane, Eccles) - 23m residual over a 250m baseline; St Edmund's RC
  # Primary via Bridgewater Primary School's own building (Bridgewater
  # Street, Little Hulton, both schools drawn on the same page) - 42.5m
  # residual over a 241m baseline. Both comfortably tight, giving confidence
  # in the grid-based method generally. A real trap found and fixed this
  # session: automatically detected grid-line spacing is not always safe to
  # trust blind - St Charles' RC Primary's map has its M60/M61 Worsley
  # Interchange sitting directly across 2 of its grid lines, and an early
  # cross-axis "spacing agreement" check was fooled into accepting a false
  # 3x-too-large spacing (both axes had independently lost the same 2
  # intermediate grid lines to motorway occlusion, so their surviving gaps
  # coincidentally agreed with each other while both being 3x the true
  # value) - caught by a real-world plausibility check (the implied page
  # width was under 1.4km for a map that visibly spans Worsley to Swinton,
  # a real ~4km) and confirmed by direct pixel inspection of a genuine thin
  # grid line at the predicted position, distinguishing it from the much
  # thicker motorway-casing colour. Every other school's spacing was
  # confirmed via multiple independent *adjacent* (not summed/multiplied)
  # grid-line-pair measurements before being trusted. 7 of the 24 linked
  # PDFs landed this session (the ones whose grid lines were cleanly
  # measurable without per-file manual intervention); the other 17 need the
  # same technique applied with more individual attention (weaker/more
  # occluded grid detection, e.g. All Hallows RC High School and Ellesmere
  # Park High School's secondary maps) - a real, proven-workable, not-yet-
  # exhausted lead for a future session, not a dead end.
  #
  # 2026-08-18 follow-up session: attempted all 17 remaining PDFs and landed
  # 10 more (17 of 24 total now digitised). The digitisation pipeline is now
  # committed to the repo at data/digitized-catchments/salford/pipeline/
  # (grid_digitise.py + schools.py + build_geojson.py) so it no longer needs
  # rebuilding from this note each session. Two real bugs found and fixed in
  # the grid-spacing estimator: (1) wide cyan-ish fills (lakes, highlighted
  # boxes) were previously counted the same as thin grid lines when scoring
  # candidate line positions - fixed via a distance-transform thinness
  # filter (a pixel deep inside a filled blob is far from any non-cyan
  # pixel; every pixel of a true ~1-3px grid line is close to its own edge).
  # (2) the raw single MINIMUM adjacent gap per axis was sometimes a
  # spurious short gap from a surviving non-grid thin feature (e.g. a
  # river's parallel double-border) rather than the real grid unit - fixed
  # by taking the MODAL adjacent gap (the value that recurs across several
  # line pairs) instead of the bare minimum, falling back to the minimum
  # only when an axis has too few lines to have a repeat. Landed this
  # session: Christ The King RC, St Joseph's RC (Ordsall), St Joseph the
  # Worker RC (Irlam, gold star not blue - the page also has a second,
  # decorative gold star inside its own legend box, disambiguated by trying
  # every star-coloured blob and keeping whichever anchor makes the
  # resulting polygon actually contain the school's own DB coordinate),
  # St Mary's RC (Swinton), St Peter's CE, St Philip's RC, The Cathedral
  # School of St Peter & St John RC, St Thomas of Canterbury RC - all via
  # fully automatic dual-axis grid detection, margins 313-2100m. Two more
  # (St Philip's CE and St Paul's CE Cross Lane) share an identical
  # underlying basemap render (same pixel dimensions, same River Irwell
  # loop at the same pixel position, different boundary overlays) where
  # only one grid line survives cleanly per file - landed using that one
  # file's own clean single-axis measurement (640px, a sharp peak ~25x
  # stronger than any competing candidate) applied to both, independently
  # verified safe since containment holds with a comfortable margin across
  # the *entire* plausible spacing range (400-1000px/km) for both schools,
  # not just at the chosen value. Declined, each for a genuine documented
  # reason (see schools.py): All Hallows RC High School and Ellesmere Park
  # High School (clean grid+star detection, but ~31m/~104m short of their
  # own DB coordinate - real near-misses, not forced); Holy Cross and All
  # Saints RC, St Mary's RC (Eccles), and St Mark's CE (three sibling
  # uploads with NO OS grid overlay at all - a different, older basemap
  # style with the school marked by a plain dot/text label, confirmed by
  # direct pixel inspection, not just automatic-detection failure);
  # St Gilbert's RC (a completely different high-resolution cadastral
  # raster scan, no grid, school shown as a shaded building footprint not a
  # star).
  #
  # 2026-08-18 follow-up session: landed St Paul's CE (Crompton Street,
  # Walkden), the last of the 24 - previously declined as "a third source
  # type... not yet calibrated". It IS a genuinely different diocesan
  # "Digital map from Dotted Eyes... Church Commissioners" parish-map
  # product (magenta boundary, not the council's own OS OpenData basemap),
  # but it turned out to have both a real (fainter/greyer) raster OS 1km
  # grid AND a real VECTOR-drawn boundary in get_drawings() - 11 separate
  # closed magenta rings, since this wide-area deanery sheet draws every
  # neighbouring parish's boundary too, not just the target one; picked
  # out by matching the ring whose huge extent matches the page-dominating
  # loop and whose georeferenced position plausibly contains the school.
  # Anchored the grid's absolute position via Nominatim/Overpass's
  # "Blackleach Reservoir" polygon centroid (colour-mask-extracted from the
  # raster basemap, matched to the OSM way's own centroid) - the implied
  # grid-line eastings/northings landed within ~15m of exact 1000m
  # multiples, strong confirmation the anchor is right. Independently
  # cross-checked: under this transform, a building explicitly labelled
  # "School" on the map sits exactly on "Crompton Street", matching the
  # predicted pixel position of the school's own real DB coordinate almost
  # exactly. Traced ring overlays pixel-perfectly on the source PDF's
  # printed boundary. Area 4.01km2, single clean Polygon, DB coordinate
  # contained with a 493m margin. All 24 of Salford's primary/secondary
  # parish-boundary PDFs are now resolved: 18 landed, 6 genuinely declined
  # (see schools.py for the exact per-file reasons).
  - local_authority_code: "355"
    local_authority_name: "Salford"
    academic_year: "2026-2027"
    source_type: "primary_catchment_partial"
    source_url: "https://www.salford.gov.uk/schools-and-learning/schools-admissions/parish-boundary-and-catchment-area-maps"
    download_url: "https://raw.githubusercontent.com/ynot-tony1/catchment-zone/main/data/digitized-catchments/salford/salford_primary_catchments.geojson"
    name_field: "db_school_name"
    format: "geojson"
    coordinate_reference_system: "EPSG:4326"
    licence: "UNCONFIRMED - the individual PDF boundary maps carry no explicit data licence statement of their own (only the usual council branding); the OS OpenData-style basemap underneath is Crown-copyright/OS-derived per standard local-authority mapping agreements. Included per this project's private, non-commercial licensing policy, not represented as open-licensed."
    last_verified_at: "2026-08-18"
    parser_name: "generic_geojson"
    enabled: true
    notes: "18 of 24 primary/secondary parish-boundary PDFs digitised from Salford's real per-school 'parish boundary map for school admissions' pages (7 landed 2026-08-17: Christ Church CofE, St Charles' RC, St Edmund's RC, St Luke's RC, St Mark's RC, St Teresa's RC, Holy Family VA RC; 10 more landed 2026-08-18: Christ The King RC, St Joseph's RC (Ordsall), St Joseph the Worker RC (Irlam), St Mary's RC (Swinton), St Peter's CE, St Philip's RC, St Philip's CE, St Paul's CE (Cross Lane), The Cathedral School of St Peter & St John RC, St Thomas of Canterbury RC; 1 more landed later the same day: St Paul's CE (Crompton Street, Walkden), a different diocesan Dotted Eyes/Church Commissioners parish-map product with its own real raster OS grid and, unusually, a real VECTOR-drawn boundary - see block comment for the full method) - 17 of the 18 use a genuine pale-cyan 1km OS National Grid overlay baked into the raster basemap (true north-up, scale read directly from measured grid-line pixel spacing, independently confirmed consistent on both axes for every school landed except St Philip's CE/St Paul's CE Cross Lane, a documented single-axis exception - see block comment) and a hand-drawn black (or, on a couple of files, gold star / red boundary) parish boundary line plus a marker for the school, anchored in absolute position via each school's own real DB/GIAS coordinate matched to its drawn marker, with scale and rotation coming independently from the grid itself (not circular); St Paul's CE (Crompton Street) alone uses the vector-path + Blackleach-Reservoir-anchored method described in the block comment. All 18 verified as single clean Polygons (dominant-piece reduction applied, zero MultiPolygon features) containing their own school's real DB coordinate with a margin of 209-2100m (17 grid-anchored schools) or 493m (St Paul's Crompton Street). All 24 of the linked PDFs are now resolved: 18 landed, 6 genuinely declined for individually-documented reasons (no OS grid on that particular basemap style, or a different unrecoverable document type) - see schools.py in the pipeline directory and the block comment above for the exact per-file reasons and the full method, including the St Charles false-3x-spacing trap and this session's distance-transform/modal-gap fixes. Digitisation pipeline committed at data/digitized-catchments/salford/pipeline/."

  # South Gloucestershire: the candidates note ("no GIS/map subdomain
  # resolves") was wrong - it never opened the council's real admissions
  # PDF booklets. South Glos LIFE (life.southglos.gov.uk, Cloudflare-
  # challenged for plain curl but clears with a real Playwright session)
  # links two genuine PDF booklets - a 228-page "Primary Schools Admission
  # guide" and a 132-page secondary equivalent
  # (search3.openobjects.com/mediamanager/southglos/directory/files/) - each
  # with real vector-drawn (not raster) "Area of Prime Responsibility" maps,
  # one per named consortium/school, each with a single closed boundary path
  # plus an exact textual boundary description. The primary booklet's
  # boundary colour is ~RGB(98,79,151); the secondary booklet uses a
  # different but equally consistent green, ~RGB(0,148,68). Anchored per
  # page using this project's own real DB school coordinates as
  # ground-control points, fitted with a full 6-parameter least-squares
  # affine transform (not a pure similarity/Umeyama fit - the source maps
  # turned out not to be perfectly conformal at this scale; switching from
  # similarity to affine took per-point residuals on the 4+ GCP consortium
  # pages from several hundred metres down to single/low-double-digit
  # metres) wherever 3 or more of a page's own real schools are available.
  # Every included school was re-verified to fall inside its zone with a
  # margin comfortably larger than the fit's own cross-validated residual
  # error. Where a page has only one real school GCP (no second school
  # plotted on the same base-map crop), a cross-page tie-point technique was
  # tried - transferring shared place-name label positions from an
  # already-well-anchored neighbouring page - but this was tested
  # explicitly on three different single-school pages (primary Map 17,
  # secondary Marlwood School, and a rescue attempt on the secondary
  # Bradley Stoke/Abbeywood/Patchway consortium) and every attempt produced
  # either an outright failure (the school landing outside its own
  # polygon) or residuals in the hundreds-to-1000+ metre range - too
  # unreliable to trust, so all single-GCP pages were declined rather than
  # shipped. See the South Gloucestershire candidate note elsewhere in this
  # file for the full per-map breakdown of what was landed vs declined and
  # why.
