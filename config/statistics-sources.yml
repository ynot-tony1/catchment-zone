# Education statistics source registry.
#
# catchment-zone pulls from the Explore Education Statistics (EES) API,
# a real DfE public API (documented at https://api.education.gov.uk/statistics/docs/,
# base URL https://api.education.gov.uk/statistics/v1). Dataset identifiers
# inside a publication are stable UUIDs assigned by DfE; this file records the
# publication slug and metric family. The ingestor's `discover-gias`-style
# discovery step resolves the current dataset UUID and latest release via the
# API's own catalogue/search endpoints at run time rather than a hardcoded
# UUID, per the "do not hardcode a temporary download URL" rule.

api:
  base_url: "https://api.education.gov.uk/statistics/v1"
  docs_url: "https://api.education.gov.uk/statistics/docs/"

publications:
  - publication_slug: "school-capacity"
    display_name: "School capacity (SCAP survey)"
    metric_codes: ["capacity_total_places", "capacity_sixth_form_places"]
    update_frequency: "annual"
    applies_to_phases: ["primary", "secondary", "all_through"]
    notes: >
      Reported by local authorities via the annual SCAP survey. Local
      authority estimates, not a school self-report; treat as a planning
      figure rather than a live roll count.

  - publication_slug: "pupil-absence-in-schools-in-england"
    display_name: "Pupil absence in schools in England"
    metric_codes: ["overall_absence_rate", "persistent_absence_rate"]
    update_frequency: "termly_and_annual"
    applies_to_phases: ["primary", "secondary", "special"]
    notes: >
      DfE has been migrating this series to "Pupil attendance in schools"
      with more frequent releases; the ingestor's discovery step must check
      both slugs and prefer whichever the API's current publication list
      marks active, logging which one it used in the IngestionRun record.

  - publication_slug: "pupil-attendance-in-schools"
    display_name: "Pupil attendance in schools"
    metric_codes:
      ["overall_absence_rate", "persistent_absence_rate", "reason_for_absence"]
    update_frequency: "weekly_experimental_and_termly_official"
    applies_to_phases: ["primary", "secondary", "special"]
    notes: >
      Successor series to pupil-absence-in-schools-in-england. Weekly figures
      are experimental statistics; only termly/annual releases should be
      shown as headline figures without an experimental-statistics label.

  - publication_slug: "school-workforce-in-england"
    display_name: "School workforce in England"
    metric_codes: ["pupil_teacher_ratio", "fte_teachers"]
    update_frequency: "annual"
    applies_to_phases: ["primary", "secondary", "special"]
    notes: "Census-based; November census point-in-time snapshot."

# ---------------------------------------------------------------------------
# School performance tables (exam/assessment results)
#
# Distinct from `publications` above: those EES publications only expose
# local-authority/regional/national aggregates (confirmed live - see
# PROJECT_STATUS.md), not per-school rows, so they can never populate
# SchoolMetric (which requires a non-null school_urn). The publications
# below are DfE's official school performance tables, republished through
# the same EES API but as genuinely school-level datasets (geographicLevel:
# "School", confirmed live against the API), downloaded via the API's CSV
# endpoint (GET /data-sets/{id}/csv) rather than its /query endpoint, since
# the CSV's column headers are the real metric names (e.g.
# "attainment8_average") while /query responses are keyed by opaque
# indicator/filter IDs this service has no live-verified mapping for.
#
# Each publication can contain many data sets (18, for key-stage-4-
# performance); dataset_title is matched against the publication's own
# data-sets listing at run time (not a hardcoded dataset UUID, consistent
# with the rest of this file), picking out the one this service wants.
#
# Every dataset mixes "headline" (whole-school, no subgroup) rows together
# with many pupil-characteristic breakdowns (by sex, disadvantage status,
# prior attainment, etc.) in the same table. headline_filter identifies
# the row per school this service imports as the school's own metric,
# ignoring the subgroup breakdown rows entirely (subgroup-level metrics
# are a possible future addition, not attempted here).
performance_datasets:
  - publication_slug: "key-stage-4-performance"
    dataset_title: "Performance tables schools data"
    display_name: "GCSE (key stage 4) performance tables"
    applies_to_phases: ["secondary", "all_through"]
    urn_field: "school_urn"
    time_period_field: "time_period"
    headline_filter:
      breakdown_topic: "Total"
      breakdown: "Total"
    metrics:
      - metric_code: "attainment8_average"
        column: "attainment8_average"
      - metric_code: "progress8_average"
        column: "progress8_average"
    notes: >
      Verified live (2026-08-02): every school's progress8_average in the
      current 2024/25 release reads "z" (DfE's not-applicable marker) -
      not a per-school gap, the whole current release does not carry it
      yet. Stored as unavailable (not suppressed, not estimated) like any
      other not-applicable cell; a later release may populate it without
      needing a code change.

  - publication_slug: "key-stage-2-attainment"
    dataset_title: "Key stage 2 institutional level  - Schools (performance)"
    display_name: "Key stage 2 (SATs) performance tables"
    applies_to_phases: ["primary"]
    urn_field: "school_urn"
    time_period_field: "time_period"
    headline_filter:
      breakdown_topic: "All pupils"
      breakdown: "Total"
      subject: "Reading, writing and maths"
    metrics:
      - metric_code: "ks2_rwm_expected_standard_percent"
        column: "expected_standard_pupil_percent"
      - metric_code: "ks2_rwm_higher_standard_percent"
        column: "higher_standard_pupil_percent"
    notes: >
      This dataset's dataset_title has two spaces between "level" and "-"
      in the API's own listing (verified live, not a typo introduced
      here) - must match exactly, not a normalised/trimmed comparison.

  - publication_slug: "key-stage-2-attainment"
    dataset_title: "Key stage 2 institutional level  - Schools (performance)"
    display_name: "Key stage 2 (SATs) average scaled scores"
    applies_to_phases: ["primary"]
    urn_field: "school_urn"
    time_period_field: "time_period"
    headline_filter:
      breakdown_topic: "All pupils"
      breakdown: "Total"
      subject: "Reading"
    metrics:
      - metric_code: "ks2_reading_average_scaled_score"
        column: "average_scaled_score"
    notes: >
      Same dataset as the row above, but average_scaled_score only has a
      real value under subject="Reading" or subject="Maths" specifically
      (verified live: it reads "z" for the combined "Reading, writing and
      maths" subject row and for "Writing", which has no scaled score at
      all - teacher-assessed, not tested) - hence a second entry with a
      different subject filter rather than one shared filter.

  - publication_slug: "key-stage-2-attainment"
    dataset_title: "Key stage 2 institutional level  - Schools (performance)"
    display_name: "Key stage 2 (SATs) average scaled scores"
    applies_to_phases: ["primary"]
    urn_field: "school_urn"
    time_period_field: "time_period"
    headline_filter:
      breakdown_topic: "All pupils"
      breakdown: "Total"
      subject: "Maths"
    metrics:
      - metric_code: "ks2_maths_average_scaled_score"
        column: "average_scaled_score"

# Metric definitions (denominator, suppression rules, comparability notes)
# live in metric-definitions.yml, not here, so a metric's meaning is defined
# once regardless of which publication currently supplies its value.
