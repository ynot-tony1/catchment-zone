# Canonical metric definitions. SchoolMetric.metric_code must reference an
# entry here. The ingestion service validates metric codes at import time and
# the web app uses this file (via packages/shared) to render definitions,
# denominators and comparability warnings next to every figure. This is the
# single source of truth for "what does this number mean", so no metric may
# be displayed anywhere without a matching entry.

metrics:
  capacity_total_places:
    label: "Total school places"
    description: "Total number of school places reported by the local authority for the site, excluding nursery places, as reported in the annual School Capacity (SCAP) survey."
    denominator: "n/a (count)"
    unit: "places"
    phases: ["primary", "secondary", "all_through"]
    comparability_notes: "A planning estimate, not a live pupil roll. Do not compare across academic years without checking for site expansion or amalgamation in the same period."

  capacity_sixth_form_places:
    label: "Sixth form places"
    description: "Reported sixth form capacity from the SCAP survey."
    denominator: "n/a (count)"
    unit: "places"
    phases: ["secondary", "all_through"]
    comparability_notes: "Only applicable to schools with a sixth form; absence of a value does not mean zero."

  overall_absence_rate:
    label: "Overall absence rate"
    description: "Percentage of possible sessions missed by pupils for any reason (authorised and unauthorised)."
    denominator: "total possible sessions"
    unit: "percent"
    phases: ["primary", "secondary", "special"]
    comparability_notes: "Not comparable across academic years affected by exceptional circumstances (e.g. periods of national disruption) without the DfE's own caveats. Termly figures are not directly comparable to full-year figures."

  persistent_absence_rate:
    label: "Persistent absence rate"
    description: "Percentage of pupils whose overall absence was 10% or more of their possible sessions."
    denominator: "number of pupils on roll for at least one session in the period"
    unit: "percent"
    phases: ["primary", "secondary", "special"]
    comparability_notes: "Threshold-based measure; small cohort schools can show large year-on-year swings from a handful of pupils crossing the 10% line."

  reason_for_absence:
    label: "Reason for absence breakdown"
    description: "Share of absence sessions attributed to specific authorised or unauthorised reason codes."
    denominator: "total absence sessions"
    unit: "percent"
    phases: ["primary", "secondary", "special"]
    comparability_notes: "Reason coding definitions have changed between DfE series revisions; check the source release notes before comparing years."

  pupil_teacher_ratio:
    label: "Pupil to teacher ratio"
    description: "Number of pupils per full-time-equivalent (FTE) teacher, from the School Workforce Census."
    denominator: "FTE teacher count"
    unit: "ratio"
    phases: ["primary", "secondary", "special"]
    comparability_notes: "A whole-school ratio, not a class-size figure. Census is a November point-in-time snapshot."

  fte_teachers:
    label: "Full-time equivalent teachers"
    description: "FTE count of teachers in service at the school, from the School Workforce Census."
    denominator: "n/a (count)"
    unit: "fte"
    phases: ["primary", "secondary", "special"]
    comparability_notes: "Point-in-time November snapshot; does not reflect in-year staff turnover."

  fsm_eligibility_rate:
    label: "Free school meal eligibility"
    description: "Percentage of pupils recorded as eligible for free school meals at the school census point."
    denominator: "pupils on roll at census point"
    unit: "percent"
    phases: ["primary", "secondary", "special"]
    comparability_notes: "A commonly used proxy for socioeconomic disadvantage, not a precise poverty measure. Eligibility rules changed with Universal Credit transitional protections; check the release's methodology note before comparing years."

  attainment8_average:
    label: "Attainment 8 score"
    description: "Average Attainment 8 score (pupils' achievement across 8 GCSE-level qualifications, from the official DfE school performance tables) for pupils at the end of key stage 4."
    denominator: "n/a (average score, 0-90 scale)"
    unit: "score"
    phases: ["secondary", "all_through"]
    comparability_notes: "Grading and methodology have changed between years (e.g. post-2020 exam disruption); DfE advises against comparing Attainment 8 scores across years without checking its own methodology notes for the releases involved. Not available for schools/colleges without a KS4 cohort (e.g. primary schools, sixth-form-only colleges)."

  progress8_average:
    label: "Progress 8 score"
    description: "Average Progress 8 score (how much progress pupils made between key stage 2 and key stage 4, relative to pupils nationally with similar prior attainment), from the official DfE school performance tables."
    denominator: "n/a (average score, typically -1 to +1)"
    unit: "score"
    phases: ["secondary", "all_through"]
    comparability_notes: "Requires a valid KS2-to-KS4 cohort match; not calculated for every school in every release (verified live: entirely unavailable in the most recent 2024/25 release at time of writing, for every school in the source data, not a per-school gap). Never comparable to Attainment 8 directly - they measure different things (absolute outcome vs. relative progress)."

  ks2_rwm_expected_standard_percent:
    label: "KS2 reading, writing & maths: expected standard"
    description: "Percentage of pupils meeting the expected standard in reading, writing and maths combined at the end of key stage 2 (SATs), from the official DfE school performance tables."
    denominator: "eligible pupils at the end of key stage 2"
    unit: "percent"
    phases: ["primary"]
    comparability_notes: "A combined measure: a pupil must meet the expected standard in all three of reading, writing and maths to count, so this is always lower than or equal to each individual subject's own rate. Small cohort schools can show large year-on-year swings from a handful of pupils."

  ks2_rwm_higher_standard_percent:
    label: "KS2 reading, writing & maths: higher standard"
    description: "Percentage of pupils meeting the higher standard in reading, writing and maths combined at the end of key stage 2 (SATs), from the official DfE school performance tables."
    denominator: "eligible pupils at the end of key stage 2"
    unit: "percent"
    phases: ["primary"]
    comparability_notes: "A combined measure across all three subjects, same caveat as the expected-standard figure. This is a subset of pupils meeting the expected standard, not an additional/separate cohort."

  ks2_reading_average_scaled_score:
    label: "KS2 reading: average scaled score"
    description: "Average scaled score in reading at the end of key stage 2 (SATs), from the official DfE school performance tables. Scaled scores run from 80 to 120; 100 is the expected standard."
    denominator: "n/a (average scaled score, 80-120 range)"
    unit: "score"
    phases: ["primary"]
    comparability_notes: "Scaled scores are designed to be comparable across years for the same subject (unlike raw marks), but DfE periodically revises the underlying test; check the release's own methodology note before comparing across a boundary year. Writing has no scaled score (it is teacher-assessed, not tested) - only reading and maths do."

  ks2_maths_average_scaled_score:
    label: "KS2 maths: average scaled score"
    description: "Average scaled score in maths at the end of key stage 2 (SATs), from the official DfE school performance tables. Scaled scores run from 80 to 120; 100 is the expected standard."
    denominator: "n/a (average scaled score, 80-120 range)"
    unit: "score"
    phases: ["primary"]
    comparability_notes: "Scaled scores are designed to be comparable across years for the same subject (unlike raw marks), but DfE periodically revises the underlying test; check the release's own methodology note before comparing across a boundary year."

  wales_ks4_capped9_points_score:
    label: "Capped 9 points score"
    description: "Capped 9 points score (interim measures version) at the end of key stage 4, from mylocalschool.gov.wales - the pupil's best 9 qualification results, points-weighted, capped at 9 entries."
    denominator: "n/a (points score)"
    unit: "score"
    phases: ["secondary"]
    comparability_notes: "Interim measures version, introduced after Wales moved away from its previous Capped 9 methodology; not directly comparable to pre-reform figures. Not published for schools without a key stage 4 cohort."

  wales_ks4_literacy_points_score:
    label: "Literacy points score"
    description: "Literacy points score at the end of key stage 4, from mylocalschool.gov.wales."
    denominator: "n/a (points score)"
    unit: "score"
    phases: ["secondary"]
    comparability_notes: "Not published for schools without a key stage 4 cohort."

  wales_ks4_numeracy_points_score:
    label: "Numeracy points score"
    description: "Numeracy points score at the end of key stage 4, from mylocalschool.gov.wales."
    denominator: "n/a (points score)"
    unit: "score"
    phases: ["secondary"]
    comparability_notes: "Not published for schools without a key stage 4 cohort."

  wales_ks4_science_points_score:
    label: "Science points score"
    description: "Science points score at the end of key stage 4, from mylocalschool.gov.wales."
    denominator: "n/a (points score)"
    unit: "score"
    phases: ["secondary"]
    comparability_notes: "Not published for schools without a key stage 4 cohort."

  wales_ks4_welsh_bacc_points_score:
    label: "Welsh Baccalaureate points score"
    description: "Welsh Baccalaureate Skills Challenge Certificate points score at the end of key stage 4, from mylocalschool.gov.wales."
    denominator: "n/a (points score)"
    unit: "score"
    phases: ["secondary"]
    comparability_notes: "Not published for schools without a key stage 4 cohort, or for schools that do not offer the Welsh Baccalaureate."
